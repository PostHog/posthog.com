name: Pricing calculator

on:
    pull_request:
        paths:
            - 'src/components/Pricing/**'
            - 'src/hooks/productData/**'
            - 'src/hooks/useProducts.tsx'
            - 'scripts/billing-products-fixture.mjs'
            - '.github/workflows/pricing-calculator.yml'

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24

            # The pricing math has no dependencies, so this doesn't need an install.
            # Same as `pnpm test:pricing-calculator`.
            - name: Test the calculator
              run: node --test src/components/Pricing/PricingCalculator/calculatorLogic.test.ts

            # Non-blocking: the expected totals in the tests are only meaningful while the fixture
            # matches what billing charges, but a price change shouldn't block an unrelated PR.
            # Same as `pnpm check-billing-prices`.
            - name: Check prices against the billing API
              continue-on-error: true
              run: node scripts/billing-products-fixture.mjs --check
