name: Auto Label Blog

# Adds the `blog` label to any PR that adds a new post under contents/blog/, so the
# Content board (https://github.com/orgs/PostHog/projects/215) can auto-add it via its
# `label:blog` filter. Project filters can't match on file paths, hence this workflow.
#
# `synchronize` is included because the post file is often added in a later commit
# rather than the first one.
#
# `pull_request_target` gives a write token for fork/bot PRs. Safe: no checkout of
# PR code, minimal permissions, no PR-controlled data interpolated into the shell.
# nosemgrep: github-actions-pull-request-target
on:
    pull_request_target:
        types: [opened, reopened, ready_for_review, synchronize]

permissions:
    contents: read
    pull-requests: write

# Rapid pushes queue redundant runs. Labeling is idempotent, so drop any in-flight
# run for the same PR.
concurrency:
    group: auto-label-blog-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    label-blog:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Add blog label if the PR adds a new post
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REPO: ${{ github.repository }}
              run: |
                  # --paginate: a handful of PRs touch more than 100 files
                  added=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
                    --jq '.[] | select(.status == "added") | .filename' \
                    | grep -E '^contents/blog/.+\.mdx?$' || true)
                  if [ -z "$added" ]; then
                    echo "No new contents/blog/ post in this PR."
                    exit 0
                  fi
                  echo "New post(s):"
                  echo "$added"
                  gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label blog
