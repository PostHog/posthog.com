name: Commit signatures

on:
    pull_request_target:
        types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
    contents: read

jobs:
    check:
        if: github.event.action != 'edited' || github.event.changes.base != null
        concurrency:
            group: commit-signatures-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
            issues: write
            statuses: write
        steps:
            - name: Read the trusted check script
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  ref: ${{ github.workflow_sha }}
                  sparse-checkout: scripts/commit-signatures
                  persist-credentials: false

            - name: Check signatures through the GitHub API
              uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
              with:
                  script: |
                      const { run } = require('./scripts/commit-signatures/check.js')
                      await run({ github, context, core })
