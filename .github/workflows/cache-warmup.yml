name: Warm build caches

on:
    schedule:
        # Daily — refresh the Cloudinary metadata cache and the persistent build caches
        # (webpack packs + MDX payloads) that preview builds restore.
        - cron: '0 6 * * *'
    workflow_dispatch:

concurrency:
    group: cache-warmup
    cancel-in-progress: true

env:
    NODE_OPTIONS: '--max_old_space_size=12288'

jobs:
    warm-cache:
        name: Warm build caches
        runs-on: depot-ubuntu-latest-8
        timeout-minutes: 45
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Set up pnpm
              uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Build cold (no Gatsby .cache) to run onPreInit's Cloudinary crawl (which
            # writes .cloudinary-resources.json) and to populate the persistent build
            # caches (node_modules/.cache/gatsby-persistent-webpack + gatsby-mdx-payloads)
            # that preview builds restore.
            - name: Build site
              run: pnpm build
              env:
                  GATSBY_MINIMAL: 'true'
                  # Provide Cloudinary creds so onPreInit crawls the resource list and writes
                  # .cloudinary-resources.json for preview builds to restore (cloud name comes
                  # from the committed .env.production).
                  CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
                  CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

            - name: Save Cloudinary metadata cache
              if: success()
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: .cloudinary-resources.json
                  key: cloudinary-${{ github.run_id }}

            # Persistent, content-revalidated build caches: webpack packs (site stages,
            # gatsby's query-engine/page-ssr engines, the MDX html renderer) plus
            # gatsby-plugin-mdx's genMDX payload cache. Safe to restore across commits —
            # webpack revalidates every entry against module contents and build
            # dependencies, and the MDX payload cache keys on node content digests plus a
            # compile-config fingerprint, so stale entries miss instead of misresolving.
            # Keyed on lockfile + patches so dependency or patch changes start fresh; the
            # run_id suffix keeps daily saves unique, with prefix restore in previews.
            - name: Save persistent build caches
              if: success()
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      node_modules/.cache/gatsby-persistent-webpack
                      node_modules/.cache/gatsby-mdx-payloads
                  key: gatsby-persistent-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}-${{ github.run_id }}
