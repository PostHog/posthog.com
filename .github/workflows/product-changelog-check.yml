name: Product changelog pages

on:
    pull_request:
        paths:
            - 'contents/docs/**/changelog.mdx'
            - 'src/components/Docs/ProductChangelog.tsx'
            - 'src/navs/index.js'
            - 'scripts/check-product-changelogs.js'
            - '.github/workflows/product-changelog-check.yml'

permissions:
    contents: read

jobs:
    check:
        name: Check product changelog pages are wired up
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '22'

            # No dependencies needed — the script only reads files.
            - name: Check product changelog pages
              run: node scripts/check-product-changelogs.js
