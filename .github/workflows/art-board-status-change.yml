name: Art board status change

# Enforces two rules for issues on the art request board
# (https://github.com/orgs/PostHog/projects/65):
# 1. Status "Done"        → close the issue
# 2. Status "Assigned: X" → remove the other default assignees
#    (exception: internal requests from team members keep everyone assigned)
#
# Runs as a scheduled poll: GitHub Actions has no workflow trigger for
# Projects V2 item changes, so board moves can't fire this directly.
# Both rules are idempotent, so re-scanning the board is safe.

permissions:
    contents: read

on:
    schedule:
        - cron: '*/30 * * * *'
    workflow_dispatch:

jobs:
    handle:
        runs-on: ubuntu-latest
        steps:
            - name: Get app token
              id: app-token
              uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
              with:
                  app-id: ${{ secrets.GH_APP_POSTHOG_ART_BOARD_BOT_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_ART_BOARD_BOT_PRIVATE_KEY }}
                  # Board items live in other repos (art/merch requests moved to
                  # PostHog/marketing) — an unscoped token only covers this repo
                  # and 403s on every cross-repo write.
                  owner: PostHog
                  repositories: |
                      posthog.com
                      marketing
            - name: Close done issues and sync assignees
              uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const ASSIGNEE_MAP = {
                        'Assigned: Daniel': { keep: 'dphawkins1617', remove: ['lottiecoxon', 'heidiberton'] },
                        'Assigned: Lottie': { keep: 'lottiecoxon',   remove: ['dphawkins1617', 'heidiberton'] },
                        'Assigned: Heidi':  { keep: 'heidiberton',   remove: ['lottiecoxon', 'dphawkins1617'] },
                      };
                      const TEAM = ['lottiecoxon', 'dphawkins1617', 'heidiberton'];

                      // ── Paginate all project items ────────────────────────────────
                      const QUERY = `
                        query($org: String!, $num: Int!, $cursor: String) {
                          organization(login: $org) {
                            projectV2(number: $num) {
                              items(first: 100, after: $cursor) {
                                pageInfo { hasNextPage endCursor }
                                nodes {
                                  fieldValueByName(name: "Status") {
                                    ... on ProjectV2ItemFieldSingleSelectValue { name }
                                  }
                                  content {
                                    ... on Issue {
                                      number state author { login }
                                      assignees(first: 10) { nodes { login } }
                                      repository { nameWithOwner }
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }`;

                      let items = [], cursor = null;
                      do {
                        const res = await github.graphql(QUERY, { org: 'PostHog', num: 65, cursor });
                        const page = res.organization.projectV2.items;
                        items = items.concat(page.nodes);
                        cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
                      } while (cursor);

                      let failures = 0;
                      for (const item of items) {
                        const status = item.fieldValueByName?.name;
                        const issue = item.content;
                        if (!status || !issue?.number || issue.state === 'CLOSED') continue;

                        const [owner, repo] = issue.repository.nameWithOwner.split('/');

                        // One inaccessible item (e.g. in a repo the token isn't
                        // scoped for) must not kill the run for the rest.
                        try {
                          // ── Done → close ──────────────────────────────────────────
                          if (status === 'Done') {
                            await github.rest.issues.update({
                              owner, repo, issue_number: issue.number,
                              state: 'closed', state_reason: 'completed',
                            });
                            console.log(`Closed ${owner}/${repo}#${issue.number}`);
                            continue;
                          }

                          // ── Assigned column → sync assignees ──────────────────────
                          const mapping = ASSIGNEE_MAP[status];
                          if (!mapping) continue;

                          if (TEAM.includes(issue.author?.login?.toLowerCase())) continue;

                          const current = issue.assignees.nodes.map(a => a.login.toLowerCase());
                          const toRemove = mapping.remove.filter(a => current.includes(a));
                          if (!toRemove.length) continue;

                          await github.rest.issues.removeAssignees({
                            owner, repo, issue_number: issue.number, assignees: toRemove,
                          });
                          console.log(`Synced assignees on ${owner}/${repo}#${issue.number}: kept @${mapping.keep}`);
                        } catch (error) {
                          failures++;
                          console.log(`Skipped ${owner}/${repo}#${issue.number}: ${error.message}`);
                        }
                      }
                      if (failures > 0) core.warning(`${failures} item(s) could not be processed.`);
