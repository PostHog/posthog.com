name: OG card titles

on:
    pull_request:
        paths:
            - 'contents/**/*.md'
            - 'contents/**/*.mdx'
            - 'src/templates/OG/sections.json'
            - 'scripts/check-og-llms-titles.js'
            - '.github/workflows/og-llms-check.yml'

permissions:
    contents: read

jobs:
    check:
        name: Check OG card titles match llms.txt
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '22'

            # No dependencies needed — the script only reads files.
            - name: Check OG card titles
              run: node scripts/check-og-llms-titles.js
