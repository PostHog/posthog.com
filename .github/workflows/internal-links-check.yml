name: Check internal links

permissions:
    contents: read

on:
    schedule:
        - cron: '0 11 * * 1' # Every Monday at 11am UTC
    pull_request:
        paths:
            - 'contents/**'
            - 'src/**'
            - 'vercel.json'
            - 'scripts/*link*'
            - '.github/workflows/internal-links-check.yml'
            - 'package.json'
            - 'pnpm-lock.yaml'
    workflow_dispatch:
        inputs:
            save_results:
                description: 'Save results to file'
                required: false
                default: 'true'
                type: boolean
            send_slack_notification:
                description: 'Send Slack notification'
                required: false
                default: 'true'
                type: boolean

jobs:
    check-internal-links:
        runs-on: depot-ubuntu-latest-8
        timeout-minutes: 45
        env:
            NODE_OPTIONS: '--max-old-space-size=16384 --expose-gc'
            GATSBY_CPU_COUNT: 1
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 2
            - name: Install pnpm
              uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '22'
                  cache: 'pnpm'
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Test link checker
              run: pnpm test:links
            - name: Build site
              id: build
              run: pnpm build
            - name: Check content links
              if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  mkdir -p link-check-results
                  ARGS=()
                  if [ -n "$BASE_SHA" ]; then ARGS+=("--changed-from=$BASE_SHA"); fi
                  set +e
                  node scripts/check-links-post-build.js link-check-results "${ARGS[@]}" > link-check-results/content.log 2>&1
                  EXIT_CODE=$?
                  tail -n 60 link-check-results/content.log
                  exit "$EXIT_CODE"
            - name: Check source code links
              if: ${{ !cancelled() && steps.build.outcome == 'success' }}
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  mkdir -p link-check-results
                  ARGS=()
                  if [ -n "$BASE_SHA" ]; then ARGS+=("--changed-from=$BASE_SHA"); fi
                  set +e
                  node scripts/check-src-links.js link-check-results "${ARGS[@]}" > link-check-results/source.log 2>&1
                  EXIT_CODE=$?
                  tail -n 60 link-check-results/source.log
                  exit "$EXIT_CODE"
            - name: Write link check summary
              if: ${{ !cancelled() }}
              run: node scripts/link-check-report.js link-check-results
            - name: Upload link check results
              if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.save_results != false) }}
              id: upload-results
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: link-check-results
                  path: link-check-results/
                  if-no-files-found: error
                  retention-days: 30
            - name: Send Slack notification
              if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.send_slack_notification != false) }}
              env:
                  GH_REPOSITORY: ${{ github.repository }}
                  GH_RUN_ID: ${{ github.run_id }}
                  GH_JOB_STATUS: ${{ job.status }}
                  GH_EVENT_NAME: ${{ github.event_name }}
                  GH_ACTOR: ${{ github.actor }}
                  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_BROKEN_WEBSITE_INTERNAL_LINKS }}
                  ARTIFACT_ID: ${{ steps.upload-results.outputs.artifact-id }}
                  SAVE_RESULTS: ${{ inputs.save_results }}
              run: node scripts/link-check-report.js link-check-results --notify
