# Starting apps. A check names one with `workspace.fixture`, and `{folder}` in its
# prompt and criteria resolves to that fixture's folder.
#
# Most fixtures live in PostHog/docs-eval-fixtures, built from wizard-workbench
# apps with every PostHog and wizard hint removed, so the agent can't copy an
# existing install (see wizard-workbench services/evals/docs-evals/prepare-fixtures.ts).
# `source` is the app it was copied from. A fixture with no `ref` isn't built yet:
# the runner refuses to launch checks that use it.

web-vite:
    repo: https://github.com/PostHog/docs-eval-fixtures
    folder: web-vite
    source: apps/basic-integration/javascript-web/saas-dashboard

react-router-7:
    repo: https://github.com/PostHog/docs-eval-fixtures
    folder: react-router-7
    source: apps/basic-integration/react-router/rrv7-starter

react-vite:
    repo: https://github.com/PostHog/docs-eval-fixtures
    folder: react-vite
    source: apps/basic-integration/tanstack-router/tanstack-router-file-based-saas

node-express:
    repo: https://github.com/PostHog/docs-eval-fixtures
    folder: node-express
    source: apps/basic-integration/javascript-node/express-todo

python-stdlib:
    repo: https://github.com/PostHog/docs-eval-fixtures
    folder: python-stdlib
    source: apps/basic-integration/python/meeting-summarizer

react-native-app:
    repo: https://github.com/PostHog/docs-eval-fixtures
    folder: react-native-app
    source: apps/basic-integration/react-native/react-native-saas

android-app:
    repo: https://github.com/PostHog/docs-eval-fixtures
    folder: android-app
    source: apps/basic-integration/android/Jetchat

ios-app:
    repo: https://github.com/PostHog/docs-eval-fixtures
    folder: ios-app
    source: apps/basic-integration/swift/hackers-ios

# Gauge's public Next.js App Router monorepo. It has no PostHog code, so it needs
# no fixtures repo and is the quickest first run.
acme-nextjs:
    repo: https://github.com/gauge-sh/acme-dispatch-nextjs
    ref: 2e2646819890345903cfa03eb0e2442a417883ed
    folder: apps/web

