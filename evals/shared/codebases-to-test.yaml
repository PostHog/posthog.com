# The codebases checks run in: a repo, a pinned commit (`ref`) and the folder the
# agent works in. A check names one with `codebase_to_test`, and `{folder}` in its
# prompt and criteria resolves to that codebase's folder. A check with no
# codebase_to_test is answer-only.
#
# A codebase with no `ref` can't run: the runner refuses to launch checks that use it.
# To move to a newer commit, update `ref` and rerun the checks that use it.

# --- Gauge reference codebases (github.com/gauge-sh). Real, public, no PostHog code.

# Minimal starters: one small app at the repo root.
starter-go: # net/http server
