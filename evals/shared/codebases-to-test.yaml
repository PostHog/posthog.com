# Acme Dispatch: the same field-service app (jobs, customers, technicians, invoices,
# user admin) in five stacks. The monorepos have a server-rendered UI in apps/web and
# a JSON API in apps/api; these entries point at apps/web. Add an `-api` entry with
# `folder: apps/api` when a check needs the API instead. Rails is one app at the root.
acme-dispatch-nextjs:
    repo: https://github.com/gauge-sh/acme-dispatch-nextjs
    ref: 2e2646819890345903cfa03eb0e2442a417883ed
    folder: apps/web
acme-dispatch-go:
    repo: https://github.com/gauge-sh/acme-dispatch-go
    ref: 7e7d35e28af46baa3a72ab2823f86c60fb5705af
    folder: apps/web
acme-dispatch-rust:
    repo: https://github.com/gauge-sh/acme-dispatch-rust
    ref: 7a3c07d7f99708dcff0eabf006e0806647c2eccd
