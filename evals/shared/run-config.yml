# Run settings: the harnesses and models every check runs on, the MCP servers a
# check can attach, and how many samples. Nothing here is specific to Gauge; evals/gauge/
# maps it to Gauge. `verified: true` means a dry run accepted the pair.
# Unverified pairs run only with --include-unverified.
harnesses:
    - id: claude-code
      models: [claude-sonnet-5-5]
      verified: true
    - id: codex
      models: [gpt-6-sol]
      verified: false

samples: 1

# MCP servers a check can attach with `attach_mcp: <name>`. MCP checks log in to a
# PostHog project made only for evals, never a real one. The runner's own pin for each
# server lives beside the runner, such as evals/gauge/mcp-servers.yml.
mcp:
    posthog:
        url: https://mcp.posthog.com/mcp

# `attach_skill: true` on a check. A placeholder: skills aren't built yet, because we
# haven't agreed which GitHub repo they live in. Every skill check is skipped.
skills:
    enabled: false
