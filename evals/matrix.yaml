# Harnesses and models the runner sends checks to. `verified: true` means the
# pair is listed by `gauge models list --hosted` for our org and a dry run
# accepted it. Unverified pairs run only with --include-unverified.
harnesses:
    - id: claude-code
      gauge: CLAUDE_CODE
      models: [claude-sonnet-5-5]
      verified: true
    - id: codex
      gauge: CODEX_CLI
      models: [gpt-6-sol]
      verified: false

# Arms a check gets when its eval file doesn't list any. `skill` joins the default
# once the docs skills are registered in Gauge (see README).
defaultArms: [baseline, link, inline]

samples: 1
