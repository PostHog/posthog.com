# A project on posthog-python 7. See "SDK major checks" in evals/README.md.
owner: wizard-and-docs
tags: [sdk-majors, python, server]
status: active
pages:
    - docs/libraries/python
    - docs/product-analytics/installation/python

checks:
    - id: capture-event
      description: >-
          Polar's FastAPI server is on posthog 7.76.1 and wraps the client in
          polar/posthog.py. Does an agent that follows the docs turn off person
          processing the way the installed major does? The prompt names no API and no
          version, so the agent must read pyproject.toml or uv.lock. No build
          criterion: the server needs Postgres and Redis to start.
      codebase_to_test: oss-polar-server
      append_docs_link: true
      prompt: >-
          In the API server in {folder}/, capture a PostHog event when a webhook
          delivery fails. It isn't tied to any user.
      criteria:
          shared: [docs-read]
          rubrics:
              event-captured: >-
                  The code path for a failed webhook delivery captures an event through
                  the PostHog service in {folder}/polar/posthog.py. Cite the file and
                  line(s).
              matches-python-7: >-
                  The event sets `$process_person_profile` to False in its properties.
                  Fails if it passes `options=` to capture, which only posthog 8 has.
              major-not-bumped: >-
                  {folder}/pyproject.toml and {folder}/uv.lock keep posthog on 7.x. Fails
                  if the agent moved it to 8 or later.
