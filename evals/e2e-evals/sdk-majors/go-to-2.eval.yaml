# Parked until posthog-go v2 ships. See "SDK major checks" in evals/README.md.
owner: wizard-and-docs
tags: [sdk-majors, go, server]
status: draft
pages:
    - docs/libraries/go
    - docs/product-analytics/installation/go

checks:
    - id: upgrade-and-capture-event
      description: >-
          The same Blnk API and task as go-on-1, with an upgrade first. Do the docs
          give an agent the v2 module path and event options? The prompt names no API.
      codebase_to_test: oss-blnk
      append_docs_link: true
      prompt: >-
          Upgrade the PostHog Go SDK to the latest major version in the API in
          {folder}/. Then capture a PostHog event when a ledger is created. The API has
          no user accounts.
      criteria:
          shared: [builds, docs-read]
          rubrics:
              on-go-2: >-
                  {folder}/go.mod requires `github.com/posthog/posthog-go/v2`, and every
                  import of the SDK, including the one in cmd/server.go, ends in `/v2`.
              matches-go-2: >-
                  The ledger event turns off person processing with `Options:
                  posthog.NewOptions().Set("process_person_profile", false)`. Fails if
                  it only sets the `$process_person_profile` property. Cite the file and
                  line(s).
