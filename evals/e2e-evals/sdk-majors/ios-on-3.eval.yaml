# A project on posthog-ios 3. See "SDK major checks" in evals/README.md.
owner: wizard-and-docs
tags: [sdk-majors, ios, mobile]
status: active
pages:
    - docs/libraries/ios
    - docs/libraries/ios/configuration
    - docs/feature-flags/installation/ios

checks:
    - id: turn-on-flags
      description: >-
          Element X iOS pins posthog-ios 3.92.6 in project.yml and turns feature flags
          off. Does an agent that follows the docs keep the project on its major?
          Version 4 needs Swift Package Manager and iOS 15. The prompt names no
          version, so the agent must read project.yml. No build criterion: Gauge runs
          on Linux.
      codebase_to_test: oss-element-x-ios
      append_docs_link: true
      prompt: >-
          Turn on PostHog feature flags in the iOS app in {folder}/ and log the enabled
          flags when they finish loading.
      criteria:
          shared: [docs-read]
          rubrics:
              flags-enabled: >-
                  ElementX/Sources/Services/Analytics/PHGPostHogConfiguration.swift no
                  longer sets preloadFeatureFlags to false.
              flags-logged: >-
                  The app logs the enabled flags after they load, from the
                  PostHogSDK.didReceiveFeatureFlags notification or an onFeatureFlags
                  listener. Cite the file and line(s).
              major-not-bumped: >-
                  project.yml still pins the PostHog package at 3.x. Fails if the agent
                  moved it to 4 or later, or raised the deployment target for the SDK.
