# Parked until posthog_flutter 6 ships. See "SDK major checks" in evals/README.md.
owner: wizard-and-docs
tags: [sdk-majors, flutter, mobile]
status: draft
pages:
    - docs/libraries/flutter
    - docs/feature-flags/installation/flutter

checks:
    - id: upgrade-and-log-flags
      description: >-
          The same Enjoy Player app and task as flutter-on-5, with an upgrade first.
          The app sets `onFeatureFlags` on the config, which 6 removes. Do the docs lead
          an agent to the new listener? No build criterion: the Gauge image has no
          Flutter SDK.
      codebase_to_test: oss-enjoy-player
      append_docs_link: true
      prompt: >-
          Upgrade posthog_flutter to the latest major version in the Flutter app in
          {folder}/. Then log the enabled PostHog feature flags each time they finish
          loading.
      criteria:
          shared: [docs-read]
          rubrics:
              on-flutter-6: >-
                  pubspec.yaml has posthog_flutter on ^6.
              matches-flutter-6: >-
                  The app logs the flags from `Posthog().onFeatureFlags((loaded) { ...
                  })`, called before setup. Fails if PostHogConfig still gets an
                  `onFeatureFlags` callback. Cite the file and line(s).
              before-send-stays-sync: >-
                  The `beforeSend` callback in lib/core/analytics/posthog_analytics.dart
                  is still synchronous: it is not `async` and does not return a Future.
