# Parked until posthog-python 8 ships. See "SDK major checks" in evals/README.md.
owner: wizard-and-docs
tags: [sdk-majors, python, server]
status: draft
pages:
    - docs/libraries/python
    - docs/product-analytics/installation/python

checks:
    - id: upgrade-and-capture-event
      description: >-
          The same Polar server and task as python-on-7, with an upgrade first. Do the
          docs give an agent the posthog 8 event options? The prompt names no API.
      codebase_to_test: oss-polar-server
      append_docs_link: true
      prompt: >-
          Upgrade the PostHog Python SDK to the latest major version in the API server
          in {folder}/. Then capture a PostHog event when a webhook delivery fails. It
          isn't tied to any user.
      criteria:
          shared: [docs-read]
          rubrics:
              on-python-8: >-
                  {folder}/pyproject.toml and {folder}/uv.lock have posthog on 8.x.
              matches-python-8: >-
                  The webhook event turns off person processing with
                  `options={"process_person_profile": False}`. Fails if it only sets the
                  `$process_person_profile` property. Cite the file and line(s).
