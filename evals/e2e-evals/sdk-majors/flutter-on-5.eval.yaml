# A project on posthog_flutter 5. See "SDK major checks" in evals/README.md.
owner: wizard-and-docs
tags: [sdk-majors, flutter, mobile]
status: active
pages:
    - docs/libraries/flutter
    - docs/feature-flags/installation/flutter

checks:
    - id: log-flags
      description: >-
          Enjoy Player is on posthog_flutter 5.60.0 and sets up PostHog in
          lib/core/analytics/. Does an agent that follows the docs listen for flags the
          way the installed major does? The prompt names no API and no version, so the
          agent must read pubspec.yaml. No build criterion: the Gauge image has no
          Flutter SDK.
      codebase_to_test: oss-enjoy-player
      append_docs_link: true
      prompt: >-
          In the Flutter app in {folder}/, log the enabled PostHog feature flags each
          time they finish loading.
      criteria:
          shared: [docs-read]
          rubrics:
              matches-flutter-5: >-
                  The app logs the flags from the `onFeatureFlags` callback on
                  PostHogConfig. Fails if it calls `Posthog().onFeatureFlags(...)`, which
                  only 6 has. Cite the file and line(s).
              major-not-bumped: >-
                  pubspec.yaml keeps posthog_flutter on ^5. Fails if the agent moved it
                  to 6 or later.
