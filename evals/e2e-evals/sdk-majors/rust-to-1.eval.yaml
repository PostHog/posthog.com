# Parked until the posthog crate 1.0 ships. See "SDK major checks" in evals/README.md.
owner: wizard-and-docs
tags: [sdk-majors, rust, server]
status: draft
pages:
    - docs/libraries/rust
    - docs/feature-flags/installation/rust

checks:
    - id: upgrade-and-check-flag
      description: >-
          The same Codemod crate and task as rust-on-0, with an upgrade first. Do the
          docs tell an agent that 1.0 is the `posthog` crate? The prompt names no API.
      codebase_to_test: oss-codemod-telemetry
      append_docs_link: true
      prompt: >-
          Upgrade the PostHog Rust SDK to the latest major version in the telemetry
          crate in {folder}/. Then add a function that checks whether a PostHog feature
          flag is enabled for the current installation.
      criteria:
          shared: [builds, docs-read]
          rubrics:
              on-rust-1: >-
                  {folder}/Cargo.toml depends on the `posthog` crate at 1.x and no longer
                  on `posthog-rs`.
              matches-rust-1: >-
                  The crate imports the SDK as `posthog`, not `posthog_rs`, and a public
                  function evaluates a feature flag for the sender's distinct ID. Cite
                  the file and line(s).
