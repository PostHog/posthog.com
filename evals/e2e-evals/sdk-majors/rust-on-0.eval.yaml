# A project on posthog-rs 0.x. See "SDK major checks" in evals/README.md.
owner: wizard-and-docs
tags: [sdk-majors, rust, server]
status: active
pages:
    - docs/libraries/rust
    - docs/feature-flags/installation/rust

checks:
    - id: check-flag
      description: >-
          Codemod's telemetry crate is on posthog-rs 0.21 and only captures events.
          Does an agent that follows the docs add a flag check with the crate the
          project has? Version 1.0 renames the crate to `posthog`. The prompt names no
          API and no version, so the agent must read Cargo.toml.
      codebase_to_test: oss-codemod-telemetry
      append_docs_link: true
      prompt: >-
          In the telemetry crate in {folder}/, add a function that checks whether a
          PostHog feature flag is enabled for the current installation.
      criteria:
          shared: [builds, docs-read]
          rubrics:
              flag-check-added: >-
                  A public function in {folder}/src evaluates a feature flag for the
                  sender's distinct ID through the PostHog client. Cite the file and
                  line(s).
              matches-rust-0: >-
                  The new code imports the SDK as `posthog_rs`. Fails if it imports from
                  a crate named `posthog`, which is the 1.0 name.
              major-not-bumped: >-
                  {folder}/Cargo.toml still depends on `posthog-rs` 0.x. Fails if it
                  adds or switches to the `posthog` crate.
