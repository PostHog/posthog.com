# A project on posthog-node 5. See "SDK major checks" in evals/README.md.
owner: wizard-and-docs
tags: [sdk-majors, node, javascript, server]
status: active
pages:
    - docs/libraries/node
    - docs/error-tracking/capture
    - docs/error-tracking/installation/nestjs

checks:
    - id: capture-error
      description: >-
          Hoppscotch's NestJS backend is on posthog-node 5.50.0 and sends one weekly
          event. Does an agent that follows the docs write error capture for the major
          the project has? The prompt names no API and no version, so the agent must
          read package.json.
      codebase_to_test: oss-hoppscotch-backend
      append_docs_link: true
      prompt: >-
          In the NestJS backend in {folder}/, report an error to PostHog when creating
          a team invitation fails. Include the inviting user's ID and the team ID.
      criteria:
          shared: [builds, docs-read]
          rubrics:
              captures-exception: >-
                  The team invitation code calls captureException on the posthog-node
                  client, directly or through PostHogService, when creating an
                  invitation fails. Cite the file and line(s).
              matches-node-5: >-
                  The call uses the posthog-node 5 signature, captureException(error,
                  distinctId, properties): the user's ID is the second argument and the
                  team ID is in the third. Fails if it passes one options object such as
                  { distinctId, properties }, which only posthog-node 6 accepts.
              major-not-bumped: >-
                  {folder}/package.json still lists posthog-node 5.x. Fails if the agent
                  moved it to 6 or later.
