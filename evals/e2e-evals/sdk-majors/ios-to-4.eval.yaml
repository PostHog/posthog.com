# Parked until posthog-ios 4 ships. See "SDK major checks" in evals/README.md.
owner: wizard-and-docs
tags: [sdk-majors, ios, mobile]
status: draft
pages:
    - docs/libraries/ios
    - docs/libraries/ios/configuration
    - docs/feature-flags/installation/ios

checks:
    - id: upgrade-and-turn-on-flags
      description: >-
          The same Element X app and task as ios-on-3, with an upgrade first. Do the
          docs give an agent the posthog-ios 4 flags listener? Version 4 removes the
          didReceiveFeatureFlags notification. No build criterion: Gauge runs on Linux.
      codebase_to_test: oss-element-x-ios
      append_docs_link: true
      prompt: >-
          Upgrade the PostHog SDK to the latest major version in the iOS app in
          {folder}/. Then turn on PostHog feature flags and log the enabled flags when
          they finish loading.
      criteria:
          shared: [docs-read]
          rubrics:
              on-ios-4: >-
                  project.yml pins the PostHog package at 4.x.
              matches-ios-4: >-
                  The app logs the flags from `PostHogSDK.shared.onFeatureFlags { ... }`.
                  Fails if it observes the PostHogSDK.didReceiveFeatureFlags
                  notification. Cite the file and line(s).
