# Simplified Chinese (mainland China). Keys match en.yml. A key that is not here shows the English text.
#
# Style rules for this locale. Follow them when you add or change a translation, and add a rule
# here when a review comment applies to more than one string. See the translate skill in
# .claude/skills/translate and src/i18n/README.md.
#
# - Tone is sober, clear, and professional, with understated humor. No internet slang or memes
#   (no "yyds", "绝绝子", "打工人"). Address the reader as 你, never 您: "你的智能体", "帮你装好 PostHog".
# - PostHog is a name. It takes no measure word and no particle before it: "PostHog 能自动诊断问题",
#   "用 PostHog 发布", "PostHog 的第一位客户".
# - Put a half-width space between Chinese and Latin letters or digits: "PostHog 能", "50 万个团队",
#   "97% 的用户", "SQL 编辑器". No space next to full-width punctuation: "（CDP-lite）", "Zendesk、Linear".
# - Use full-width punctuation: ，。：；！？（）, 、 for lists, and “ ” for quotes (not 「」). Never use
#   the —— dash or an em dash. Rephrase with ，or ：instead: "自动修复 bug，全程无需你写提示词".
# - Keep the English words Chinese devs use: bug, pull request, issue, SDK, API, MCP, webhook, Cookie,
#   logo, CTA, scout. Use the standard Chinese term where it is the norm: 智能体 (agent), 漏斗, 回放,
#   数据仓库, 仪表盘, 自托管, 更新日志. Product and feature names stay in English: Session Replay, Inbox,
#   Self-driving, context warehouse.
# - Numbers: use 万 for round large numbers ("50 万个团队", "每月 100 万个事件") and a comma for the
#   rest ("5,000 次录制"). Real prices stay in US dollars, written after the number: "0.00005 美元/个事件".
#   Joke amounts use RMB: "¥0", "首单立减 0 元".
# - Localize the jokes with references that mainland readers of any age know, and keep them light and
#   non-political: Kim K -> 成龙代言, a Bond villain -> 金庸小说反派, "hop on a quick call" with sales ->
#   "加个销售微信", explaining your job to parents -> 过年跟亲戚讲, Hillary Clinton -> 默克尔.
# - Use the standard Chinese UI wording and keep labels short: "换一批", "免费开始", "回收站", "收起".
# - In Markdown, put full-width punctuation outside the ** markers: "**公开透明**。你可以", not
#   "**公开透明。**你可以". CommonMark does not close the bold when ** sits between 。 and a character.
name: 简体中文
lang: zh-CN
messages:
    meta:
        title: PostHog - 你产品的上下文层
        description: PostHog 自动诊断问题、修复 bug、生成 pull request，全程无需你写一句提示词。

    hero:
        H1: 你产品的<emphasis>上下文层</emphasis>
        body:
            1: PostHog 采集并存储你的<highlight>分析、错误、回放和业务数据</highlight>，让你和你的<underline>智能体</underline>随时查询，并据此行动。
            2: 超过 50 万个团队已经在用 PostHog 打造产品。
        cta:
            heading: <highlight>免费</highlight>接入 <logo/>
            body:
                1: 97% 的用户从没付过一分钱
                2: 无需信用卡
                3: 安装向导自动帮你装好 PostHog
            button:
                1: 开始使用
                2:
                    label: 用 AI 安装
                    body: 更习惯终端？不用开浏览器：

    section:
        2:
            carousel:
                pause: 暂停轮播
                resume: 继续轮播
        2a:
            toggle: 问 PostHog 任何问题
            heading: 问 PostHog 任何问题
            body:
                1: PostHog 是采集、存储和查询产品与公司数据的统一平台。分析、回放、错误和日志实时关联，回答你的任何问题。
                2: 从 <link>{count}+ 个数据源</link>导入第三方数据，让全貌更完整。
            button: 免费开始
            products:
                more: 还有 <count/> 个
                caption: '{products} 的数据都会流入你的智能体。'
                label: PostHog 工具
                view_all: 查看全部 {count} 个工具
            demo:
                label: PostHog AI 演示
                description: 演示说明：PostHog AI 结合 Google Ads 流量、PostHog 漏斗、Stripe 支付和 GitHub 变更，排查付费转化下降的原因。它发现移动端结账页多了一个必填字段，建议测试更短的结账流程。所有结果均为示例数据。
                prompt: 为什么注册量在涨，付费转化却在跌？
                reply:
                    1: 我来梳理从广告点击到付费客户的完整路径。
                    2: 下降在付款之前就开始了。
                    3: 移动端结账新增的一个必填字段正在让客户流失。
                    4: 建议测试更短的移动端结账流程。
                step:
                    1:
                        body: 对比各广告活动的流量
                        result: 访客更多，人群没变
                    2:
                        body: 分析注册 → 付款漏斗
                        result: 移动端结账环节流失
                    3:
                        body: 检查付款和被拒交易
                        result: 被拒交易没有增加
                    4:
                        body: 查看最近的结账改动
                        result: 新增了一个必填字段

        2b:
            toggle: 让智能体了解你的产品
            heading: 让智能体了解你的产品
            body: 直接在编辑器里查询产品数据，不用来回切到浏览器。从临时分析到发布新功能，都能在这里完成，无需任何新界面。
            cta:
                label: 安装 PostHog MCP
                alt: 或者使用 <link>PostHog Desktop</link>
            demo:
                agents: 你的智能体

        2c:
            toggle: 用 PostHog 发布
            heading: 用 PostHog 发布
            body: Inbox 会把相关发现整理成有调研依据的报告，并按优先级排序。你来审阅建议的改进和 pull request，再决定哪些上线。
            button: 免费开始
            signals:
                heading: Self-driving 的信号来源：
                1:
                    body: 归并为 issue 的异常和堆栈跟踪
                2:
                    body: 无效点击、快速返回、长时间卡顿
                3:
                    title: 客户支持
                    body: 来自用户的工单和对话
                4:
                    title: 外部工具
                    body: Zendesk、Linear 和 GitHub 的 issue
            demo:
                description: Self-driving Inbox 示例。四份示例报告依次到达，最新的在最上面：一个来自 GitHub 的发票请求、一个附带 pull request 草稿的转化追踪 scout、一个来自 Session Replay 的结账问题，以及一个已有待审 pull request 的高优先级登录错误。

        3:
            heading: 客户背书
            body: 没错，他们是真的在用。也不是哪位工程师两年前随手试了一下，就再没打开过。
            button: 查看客户
            shuffle: 换一批
            logo:
                first_customer: PostHog 的第一位客户！
                story: 阅读客户故事
            breakdown:
                colorful:
                    col1: 多彩的 logo
                    col2: 有“高级感”的 logo
                hardware:
                    col1: 硬件公司
                    col2: 不做硬件的公司
                planes:
                    col1: 造飞机
                    col2: 暂时不造飞机
                caseStudy:
                    col1: 有 PostHog 客户案例的公司
                    col2: 该写客户案例的公司
                easyToYell:
                    col1: 一口气就能喊出来
                    col2: 得换口气才喊得完
                goodBandName:
                    col1: 适合当乐队名
                    col2: 听起来像某种药
                explainable:
                    col1: 过年能跟亲戚讲清楚
                    col2: 过年怎么也讲不清楚
                shortNames:
                    col1: 不超过 7 个字母
                    col2: 很容易拼错
                realWords:
                    col1: 词典里查得到
                    col2: 词典里查不到
                american:
                    col1: 创立于美国
                    col2: 并非创立于美国
                pokemon:
                    col1: 像宝可梦的名字
                    col2: 像金庸小说里的反派
                arr:
                    col1: 用 ARR 衡量
                    col2: 用 GDP 衡量
                devTool:
                    col1: 热门开发者工具
                    col2: 很热门，但不是开发者工具
                usesPostHog:
                    col1: 在用 PostHog
                    col2: 也在用 PostHog

        4:
            heading: 你的所有数据，<highlight>彼此打通</highlight>
            list:
                heading: context warehouse 开箱<highlight>自带</highlight>：
                1: 数据仓库 <tooltip/>
                2: 120+ 个数据源/目标
                3: SQL 编辑器 + BI + 数据可视化
                4: 用户活动流（CDP-lite）
                5: API、webhook
            # Markdown. Keep the formatting.
            body:
                1: 无论是分析客户使用情况，还是指挥 AI，你都需要*完整*的上下文。
                2: 把所有数据汇总到 PostHog 的 context warehouse，你、你的智能体和仪表盘都能直接查询。其中包括：
                list:
                    1: 来自 Stripe、Postgres、HubSpot 等 120+ 个外部数据源的数据
                    2: 来自其他所有 PostHog 工具（如 Session Replay 和 Experiments）的洞察
                3: 智能体做出好决策所需的数据，这里都有。把“告诉我发生了什么”变成“接下来该修这个”。
            tooltip: 也可以连接你自己的仓库！
            button: 连接第一个数据源

        5:
            heading: 按用量计费
            # Markdown. Keep the formatting.
            body:
                1: 我们的理念很简单：你不该为价格操心。
                2: 所有付费产品都按用量计费，每月还有慷慨的免费额度。事实上，98% 的客户都在免费使用 PostHog。
                3: 在大规模使用时，我们力求和最便宜的方案一样便宜，让 PostHog 成为不用多想的选择。想知道价格，也不必先“加个销售微信”。
                4: 以下是几款热门产品的计费示例：
            label:
                freetier: 免费额度
                pricing: 价格
                product: 产品
                pricing_table: 价格（用量越大越便宜）
            product:
                1:
                    freetier: 每月 100 万个事件
                    pricing: 0.00005 美元/个事件
                2:
                    freetier: 每月 5,000 次录制
                    pricing: 0.005 美元/次录制
                3:
                    freetier: 每月 100 万次请求
                    pricing: 0.0001 美元/次请求
                4:
                    freetier: 每月 100 万行
                    pricing: 0.000015 美元/行
            button: 查看定价

        6:
            heading: 为什么选 PostHog？
            body: 我们和大多数公司不太一样，原因有好几个：
            list:
                # Markdown. Keep the links.
                1: '**公开透明**。你可以随时翻看我们的[公司手册](/handbook)、[销售手册](/handbook/growth/sales/overview)，甚至[公司战略](/handbook/why-does-posthog-exist)。'
                2: '**我们发布得很快**。看看[更新日志](/changelog)就知道了。'
                3: <bold>真正</bold><emphasis>懂技术</emphasis><bold>的支持。</bold>我们的<team>支持团队</team>全员都有工程背景。
            button: 了解我们

        7:
            heading: 睡前读物
            body: 还在看？这里有几个链接，你或许会有那么一点兴趣：
            link:
                2: 技术文档
                3: API
                4: 提个问题
                5: PostHog 的小团队

        8:
            heading: 硬广时间
            body: 如果前面的内容还没打动你，希望这些经典营销套路能行。
            box:
                badge: 环保
                subtitle: 数字版下载*
            sticker:
                1: G2 上的用户都说好
                2: <small>没</small>请<br/>成龙代言
            cart:
                label: 3 人<small>（本来会）</small>把 PostHog 加入购物车*
                footnote: '*如果这是真的购物车'
            footnote: '*PostHog 是网页产品，没法用光盘安装。<br/>不过我们<emphasis>确实</emphasis>给一些客户寄过软盘，里面是个 Rickroll 恶作剧。'
            cloud:
                heading: 选择你的云
                option:
                    1: 美国（弗吉尼亚）
                    2: 欧盟（法兰克福）
            price:
                label: 起价：
                old: ¥0
                new: 免费
                urgency: '><larger>该价格仅剩 1 件！！</larger>'
            button: 开始使用
            urgency:
                label: <bold>抓紧时间！</bold><today>今日</today>注册公司数：{companies}<br/>立即下单，首单立减 0 元。
                fallback: 多到数不清

