# Polish. Keys match en.yml. A key that is not here shows the English text.
#
# Style rules for this locale. Follow them when you add or change a translation, and add a rule
# here when a review comment applies to more than one string. See the translate skill in
# .claude/skills/translate and src/i18n/README.md.
#
# - Write like a Polish dev talks to another dev: casual, short, and funny. Use "ty", never "Pan/Pani" or "Państwo".
# - Write "ty", "twój", "ciebie", and "ci" in lowercase, except at the start of a sentence. Capitals used as
#   formal address read stiff here: "twoi agenci", "zainstaluje ci PostHoga", not "Twoi agenci".
# - PostHog is a masculine noun, so inflect it like any Polish noun: "PostHoga", "z PostHogiem", "w PostHogu",
#   "o PostHogu". Use the plain form only in the nominative ("Dlaczego PostHog?", "PostHog zbiera"). Inflect
#   GitHub the same way ("na GitHubie"). Product names such as Feature Flags, Session Replay, PostHog AI,
#   PostHog Desktop, Inbox, and Experiments stay in English and uninflected. Translate generic descriptions
#   naturally: "dane analityczne", "informacje o błędach", "nagrania sesji". Keep code, commands, URLs,
#   and product UI labels in demos unchanged.
# - Keep the English tech words that Polish devs say, with Polish endings: bugi, featury (featurów), pull requesty,
#   deploy, eventy, requesty, tickety, feed, support, checkout (w checkoucie), dead clicki, case study.
#   Use an apostrophe when the English spelling ends in a letter you do not pronounce: "stack trace'y",
#   "hardware'u". Keep "wizard", not "kreator". Use the normal Polish word when devs use it too: lejek,
#   rejestracja, hurtownia danych, nagrania sesji, wnioski. Do not borrow an English word just because it
#   appears in the source.
# - Dev slang is welcome when it is clear: "odpal", "podepnij", "dowozimy", "leci na proda", "zwiechy", "sztos", "olej".
# - Localize the jokes with Polish references that land the same way: Kim K -> Magda Gessler, a Bond villain ->
#   "potwór z Wiedźmina", "hop on a quick call" -> "wskakiwać na szybkiego calla" (corpo-speak), an install
#   CD -> "płyta z CD-Action". Preserve what makes the joke work; do not swap famous names mechanically.
#   Rewrite or drop an aside if the comparison no longer makes sense. Section 8 parodies Allegro-style
#   sales copy: "Ostatnia sztuka", "Gratis", "zgarnij".
# - Typography: Polish quotes „…”, an en dash with a space on each side ( – ), never an em dash. No space before
#   "!", "?", or ":". A colon is followed by a lowercase word.
# - Numbers: a decimal comma, and a non-breaking space as the thousands separator from five digits up
#   ("500 000", but "5000"). Use "mln" for millions ("1 mln"). Real prices stay in US dollars, with "$"
#   before the number ("$0,005"). Joke amounts use złoty: "0 zł rabatu".
# - For dynamic counts, choose wording that remains grammatical for every possible value, e.g.
#   "narzędzia ({count})".
# - Cut words the sentence does not need. Polish runs longer than English, so keep toggles, buttons, and menu labels short.
