# Japanese. Keys match en.yml. A key that is not here shows the English text.
#
# Style rules for this locale. Follow them when you add or change a translation, and add a rule
# here when a review comment applies to more than one string. See the translate skill in
# .claude/skills/translate and src/i18n/README.md.
#
# - Tone is polite and trustworthy, with PostHog's light, irreverent touch where it fits. Keep the playful gags,
#   but never use pejorative slang. Body copy uses です/ます: "97%の顧客は PostHog を無料で使っています。"
#   Avoid stiff "forced translation" phrasing: pick the wording a Japanese product site would use, even if a
#   gag gets milder ("お問い合わせ", not "人間と話す").
#   Headings, buttons, toggles, and menu labels use a short noun or verb form: "料金を見る", "無料で始める", "従量課金制".
#   Avoid "あなた" when the sentence works without it. Use "お使いの", "チーム", or drop the subject: "お使いのデータウェアハウス".
# - PostHog (the product and the company) takes particles directly: "PostHog は", "PostHog を開く", "PostHog について".
#   Use "私たち" only when the English says "we" and the sentence needs a subject.
# - Spacing: put a half-width space between Japanese and a Latin word, a Latin placeholder, or a Latin tag:
#   "PostHog を", "AI でインストール", "{products} のデータ", "<logo/> を". Do NOT put a space between Japanese and a
#   numeral or a numeric placeholder: "50万以上", "97%", "100万イベント/月", "{count}以上のソース", "0円".
#   Never put a space next to full-width punctuation or brackets: "Cookie バナー", "（CDP-lite）".
# - Punctuation is full-width: 。、「」（）：？！. Use "…", not "...". Do not use an em dash. Keep "/" and "+" half-width
#   in lists ("SQL エディター + BI + データ可視化").
# - Tech words: use the katakana that Japanese devs say: プルリクエスト, バグ, コンテキスト, AI エージェント, デッドクリック,
#   ファネル. Always write "AI エージェント", never "エージェント" alone. Use "機能", not "フィーチャー". Translate "ship" as "リリース", never "出荷". Use the long vowel mark for -er/-or
#   words: エディター, ジェネレーター, ユーザー. Choose "ログイン" over "サインイン".
# - Analytics as data is "行動データ", and analyzing it is "分析" (not "アナリティクス"). A replay is "セッションリプレイ".
#   Data is stored with "蓄積", not "保存" (which reads like saving a file). Prefer "アクセス" or "活用" over "クエリ" in prose.
#   "Conversion" to paid is "有料転換率".
# - Keep product and brand names in English, also inside a sentence: Session Replay, Experiments, Inbox, Self-driving,
#   context warehouse, PostHog MCP, GitHub issue.
# - Humor is gentle and understated. Keep each gag. Swap a US reference for a Japanese one only when the swap keeps
#   the joke: Bond villain -> "特撮の悪の組織", Kim K -> "芸能人非御用達", "jump on a quick call" ->
#   「料金はお問い合わせください」, explaining to parents -> "お正月に親戚へ説明". When the joke depends on the person
#   (Ursula von der Leyen looks like Hillary Clinton), keep the original reference: "ヒラリー・クリントンさん".
#   No memes.
# - No exclamation marks for excitement. The only exception is the pushy e-commerce parody in section 8, which
#   copies Japanese TV shopping: "今ならなんと、初回ご注文が0円引き！", "この価格で残り1点！！".
# - Real prices stay in US dollars with a period for decimals and a comma for thousands: "$0.00005/イベント", "5,000件/月".
#   Joke amounts use yen: "0円".
# - Keep it short. Cut words that the sentence does not need, especially in headings and taskbar labels.
name: 日本語
messages:
    meta:
        title: PostHog - プロダクトのコンテキストレイヤー
        description: PostHog は、指示を待たずに問題の原因を突き止め、バグの修正からプルリクエストの作成まで自動で対応します。

    hero:
        H1: プロダクトの<emphasis>コンテキストレイヤー</emphasis>
        body:
            1: PostHog は<highlight>行動データ、エラー、セッションリプレイ、ビジネスデータ</highlight>を取り込み、チームも<underline>AI エージェント</underline>も活用しやすい形で蓄積します。
            2: 50万以上のチームが PostHog を活用しています。
        cta:
            heading: <logo/> を<highlight>無料で</highlight>使ってみる
            body:
                1: 97%のユーザーが無料で利用
                2: クレジットカード不要
                3: セットアップウィザードが PostHog を自動でインストール
            button:
                1: 無料で始める
                2:
                    label: AI でインストール
                    body: ターミナルで始めたい方に：

    section:
        2:
            carousel:
                pause: カルーセルを一時停止
                resume: カルーセルを再開
        2a:
            toggle: PostHog に何でも質問
            heading: PostHog に何でも質問
            body:
                1: PostHog なら、行動データとビジネスデータの取り込みから蓄積・分析までを、ワンストップで実現できます。セッションリプレイ、エラー、ログも行動データとひとつに統合し、あらゆる疑問に答えます。
                2: <link>{count}以上のソース</link>から外部のデータも取り込めば、全体像がさらに明確になります。
            button: 無料で始める
            products:
                more: ほか<count/>個
                caption: '{products} のデータを、AI エージェントに連携します。'
                label: PostHog のツール
                view_all: 全{count}個のツールを見る
            demo:
                label: PostHog AI のデモ
                description: デモの例：PostHog AI が、Google Ads のトラフィック、PostHog のファネル、Stripe の決済、GitHub の変更をもとに、有料転換率の低下を調査します。モバイルのチェックアウトに必須項目が1つ増えていることを突き止め、チェックアウトを短くするテストを提案します。結果はすべてサンプルデータです。
                prompt: 新規登録は増えているのに、有料転換率が下がっているのはなぜ？
                reply:
                    1: 広告のクリックから有料顧客になるまでの流れを追ってみます。
                    2: 低下は支払いより前の段階で始まっています。
                    3: モバイルのチェックアウトに追加された必須項目が原因で、顧客が離脱しています。
                    4: モバイルのチェックアウトを短くして、A/B テストで検証しましょう。
                step:
                    1:
                        body: キャンペーンのトラフィックを比較
                        result: 訪問者は増加、客層は変化なし
                    2:
                        body: 新規登録 → 支払いのファネルを分析
                        result: モバイルのチェックアウトで離脱
                    3:
                        body: 支払いと決済拒否を確認
                        result: 決済拒否の件数は変化なし
                    4:
                        body: 最近のチェックアウトの変更を確認
                        result: 必須項目が追加されていた

        2b:
            toggle: AI エージェントにプロダクトのコンテキストを
            heading: AI エージェントにプロダクトのコンテキストを
            body: ブラウザに切り替えずに、エディターから直接行動データにアクセスできます。単発の分析から新機能のリリースまでをワンストップで実現。新しい UI は必要ありません。
            cta:
                label: PostHog MCP サーバーをインストール
                alt: または <link>PostHog Desktop</link> を使う
            demo:
                agents: AI エージェント

        2c:
            toggle: PostHog でリリース
            heading: PostHog でリリース
            body: Inbox は関連する調査結果をまとめ、調査済みのレポートとして優先度順に並べます。提案された改善案とプルリクエストを確認し、何をリリースするかを決めてください。
            button: 無料で始める
            signals:
                heading: Self-driving が集めるシグナル：
                1:
                    body: issue ごとにまとめた例外とスタックトレース
                2:
                    body: デッドクリック、クイックバック、画面のフリーズ
                3:
                    title: サポート
                    body: ユーザーからのチケットや問い合わせ
                4:
                    title: 外部ツール
                    body: Zendesk、Linear、GitHub の issue
            demo:
                description: Self-driving Inbox のイメージです。4件のサンプルレポートが、新しいものを先頭に1件ずつ届きます。GitHub からの請求書に関するリクエスト、プルリクエストの下書きが付いたコンバージョントラッキングの scout、Session Replay で見つかったチェックアウトの問題、そしてレビュー待ちのプルリクエストが付いた優先度の高いログインエラーです。

        3:
            heading: 導入実績
            body: はい、実際に使っていただいています。いいえ、「2年以上前にどこかのエンジニアが一度試しただけ」ではありません。
            button: 導入企業を見る
            shuffle: シャッフル
            logo:
                first_customer: PostHog の最初の顧客
                story: 導入事例を読む
            breakdown:
                colorful:
                    col1: カラフルなロゴ
                    col2: 「洗練された」ロゴ
                hardware:
                    col1: ハードウェア企業
                    col2: ハードウェア企業以外
                planes:
                    col1: 飛行機をつくっている
                    col2: 飛行機はつくっていない（今のところ）
                caseStudy:
                    col1: PostHog の導入事例がある企業
                    col2: そろそろ導入事例をお願いしたい企業
                easyToYell:
                    col1: 叫びやすい名前
                    col2: 息継ぎが必要な名前
                goodBandName:
                    col1: バンド名にぴったり
                    col2: 胃薬にありそうな名前
                explainable:
                    col1: 親にも説明できる会社
                    col2: お正月に親戚へ説明しづらい会社
                shortNames:
                    col1: 7文字以内の名前
                    col2: 打ち間違えやすい名前
                realWords:
                    col1: 辞書に載っている単語
                    col2: 辞書に載っていない単語
                american:
                    col1: アメリカ発
                    col2: アメリカ発ではない
                pokemon:
                    col1: ポケモンにいそう
                    col2: 特撮の悪の組織にいそう
                arr:
                    col1: 規模を ARR で測る
                    col2: 規模を GDP で測る
                devTool:
                    col1: 話題の開発ツール
                    col2: 話題だけど開発ツールではない
                usesPostHog:
                    col1: PostHog を使っている
                    col2: こちらも PostHog を使っている

        4:
            heading: すべてのデータが <highlight>PostHog でひとつに</highlight>
            list:
                heading: context warehouse の<highlight>標準搭載</highlight>機能：
                1: データウェアハウス <tooltip/>
                2: 120以上のデータソース/送信先
                3: SQL エディター + BI + データ可視化
                4: ユーザーアクティビティフィード（CDP-lite）
                5: API、Webhook
            # Markdown. Keep the formatting.
            body:
                1: 顧客の利用状況を分析するときも、AI に指示を出すときも、*すべて*のコンテキストがそろっていることが重要です。
                2: PostHog の context warehouse にすべてを集約すれば、チームも AI エージェントもダッシュボードも、そのデータに直接アクセスできます。対象は次のとおりです：
                list:
                    1: Stripe、Postgres、HubSpot など、120以上の外部ソースのデータ
                    2: Session Replay や Experiments など、PostHog の各ツールから得られるインサイト
                3: AI エージェントが的確な判断を下すために必要なデータは、すでにここにそろっています。「何が起きたのか教えて」を「次に直すべきはここ」に変える準備はできています。
            tooltip: お使いのデータウェアハウスも接続できます。
            button: まずはデータソースを接続

        5:
            heading: 従量課金制
            # Markdown. Keep the formatting.
            body:
                1: 料金のことで悩ませない。それが私たちの基本的な考え方です。
                2: 有料プロダクトはすべて従量課金制で、毎月たっぷりの無料枠があります。実際、97%の顧客は PostHog を無料で使っています。
                3: 大規模に使っても、最も安い選択肢と同じ水準を目指しています。PostHog は、迷わず選べる存在であるべきだからです。「料金はお問い合わせください」と言われることもありません。
                4: 人気プロダクトの料金例をいくつかご紹介します：
            label:
                freetier: 無料枠
                pricing: 料金
                product: プロダクト
                pricing_table: 料金（利用量が増えるほど割安）
            product:
                1:
                    freetier: 100万イベント/月
                    pricing: $0.00005/イベント
                2:
                    freetier: 5,000件/月
                    pricing: $0.005/件
                3:
                    freetier: 100万リクエスト/月
                    pricing: $0.0001/リクエスト
                4:
                    freetier: 100万行/月
                    pricing: $0.000015/行
            button: 料金を見る

        6:
            heading: PostHog が選ばれる理由
            body: PostHog には、他社とは違う点がいくつもあります：
            list:
                # Markdown. Keep the links.
                1: '**透明性。** [ハンドブック](/handbook)、[営業マニュアル](/handbook/growth/sales/overview)、[会社の戦略](/handbook/why-does-posthog-exist)まで、すべて公開しています。'
                2: '**リリースが速い。** [変更履歴](/changelog)をご覧ください。'
                3: <emphasis>本当に</emphasis><bold>技術に強いサポート。</bold><team>サポートチーム</team>は全員エンジニア出身です。
            button: PostHog を詳しく見る

        7:
            heading: 寝る前の読書
            body: まだ読んでくださっている方へ。少しだけ興味を持っていただけそうなリンクを集めました：
            link:
                2: 技術ドキュメント
                3: API
                4: 質問する
                5: PostHog のスモールチーム

        8:
            heading: 開き直りの CTA
            body: ここまで読んでも決め手がなかった方へ。昔ながらのマーケティング手法で、最後のひと押しをさせてください。
            box:
                badge: 環境にやさしい
                subtitle: ダウンロード版*
            sticker:
                1: G2 のみなさまから高評価
                2: 芸能人<br/><small>非</small>御用達
            cart:
                label: 現在3人が PostHog をカートに入れています<small>（仮）</small>*
                footnote: '*本物のカートだったら、の話です'
            footnote: '*PostHog は Web サービスのため、CD ではインストールできません。<br/>一度だけ、顧客にフロッピーディスクを送ったことは<emphasis>あります</emphasis>。中身はリックロールでした。'
            cloud:
                heading: クラウドを選択
                option:
                    1: 米国（バージニア）
                    2: EU（フランクフルト）
            price:
                label: 特別価格：
                old: 0円
                new: 無料
                urgency: '<larger>この価格で残り1点！！</larger>'
            button: 今すぐ始める
            urgency:
                # {companies} is today's signup count, or `fallback` when it is not loaded yet.
                label: <bold>お急ぎください！</bold><today>本日</today>だけで{companies}の企業が登録しました。<br/>今ならなんと、初回ご注文が0円引き！
                fallback: 多く

    cookie:
        heading: 法律で義務づけられた Cookie バナー
        body:
            1: PostHog.com はサードパーティ Cookie を使わず、自社の Cookie を1つだけ使用しています。
            2: 第三者にデータを送ることはありません。（<tooltip>ウルズラ・フォン・デア・ライエン</tooltip>も、きっと誇りに思ってくれるはずです。）
        tooltip:
