section.4.body.1: Whether you're analyzing customer usage or directing AI, you should be operating with the *full* context.
section.4.body.2: "Combine everything in PostHog's context warehouse so that you, your agents, and your dashboard can query it directly. That includes:"
section.4.body.3: The data your agents need to make good decisions is already here. Ready to turn "tell me what happened" into "here's what to fix next."
section.4.body.list.1: Data from 120+ external sources like Stripe, Postgres, and HubSpot
section.4.body.list.2: Insights from every other PostHog tool like Session Replays and Experiments
