section.5.heading: Usage-based pricing
section.5.body.1: Our whole philosophy is that you shouldn't have to worry about pricing.
section.5.body.2: All our paid products are pay-per-use with generous monthly free tiers. In fact, 98% of our customers use PostHog for free.
section.5.body.3: We aim to match the cheapest option at scale – PostHog should be a no-brainer. You never have to "jump on a quick call" with sales.
section.5.body.4: 'Here are some examples of how we charge for most popular products:'
