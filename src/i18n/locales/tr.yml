# Turkish. Keys match en.yml. A key that is not here shows the English text.
#
# Style rules for this locale. Follow them when you add or change a translation, and add a rule
# here when a review comment applies to more than one string. See the translate skill in
# .claude/skills/translate and src/i18n/README.md.
#
# - Write like a Turkish dev talks to another dev: casual, short, and funny. Use "sen", never "siz":
#   "PostHog'u kur", "karar sen ver", not "kurunuz" or "karar verebilirsiniz". Use "biz" for PostHog.
# - Suffixes on a Latin name or an English word go after an apostrophe, and follow the vowel harmony of
#   how the word is SAID, not how it is spelled. PostHog ends in "o": PostHog'u, PostHog'a, PostHog'un,
#   PostHog'da, PostHog'la. Also Max'a (not Max'e), Inbox'un, GitHub'dan, MCP'si, %97'si, 9'u.
# - Keep the English tech words Turkish devs say: bug, feature, pull request, deploy, signup, checkout,
#   funnel, agent, replay, dashboard, changelog, stack trace, dead click, exception, issue, Docs.
#   Suffix them by sound: bug'lar, feature'lar, agent'lar, replay'ler, pull request'ler, checkout'ta,
#   funnel'ını, issue'lar. Use Turkish where devs do: hata, destek, ekip, bağlam, loglar, and
#   "canlıya almak" for "ship" ("PostHog'la canlıya al").
# - Do not put a suffix right after a tag or a {placeholder}, because the value is not known or is an
#   image. Rephrase instead: "<logo/> kurulumu bedava", "{count}+ kaynaktan".
# - Localize the jokes with Turkish references that land the same way: Kim K -> Acun, a Bond villain ->
#   "Yeşilçam kötüsü", "hop on a quick call" -> "müşteri temsilcisine bağlanmak için 9'u tuşla",
#   Hillary Clinton -> Tansu Çiller, GDPR pride -> KVKK, "1 left at this price" -> "Zam gelmeden son 1 adet",
#   parents who do not get tech -> "Annen 'kripto mu o?' der".
# - Numbers use a dot for thousands and a comma for decimals: 500.000, 0,00005 $. The percent sign goes
#   first: %98. Real prices stay in US dollars, with the symbol after the number ("0,005 $/kayıt").
#   Joke amounts use Turkish lira: "0 TL indirim".
# - No Oxford comma in Turkish: "analitik, hatalar ve loglar". No em dash: use a comma, a colon, or a
#   new sentence. Mind the dotted and dotless i when you capitalize (İ/i, I/ı).
# - Keep headings, toggles, buttons, and menu labels short. Cut words the sentence does not need.
name: Türkçe
messages:
    meta:
        title: PostHog - ürününün bağlam katmanı
        description: PostHog sorunları kendi kendine teşhis eder, bug'ları düzeltir ve pull request açar. Üstelik senin yönlendirmene gerek kalmadan.

    hero:
        H1: Ürününün <emphasis>bağlam katmanı</emphasis>
        body:
            1: PostHog <highlight>analitik verilerini, hatalarını, oturum kayıtlarını ve iş verilerini</highlight> toplar ve saklar. Böylece hem sen hem de <underline>agent'ların</underline> bunları sorgulayıp harekete geçebilirsiniz.
            2: PostHog'la ürün çıkaran 500.000'den fazla ekibe sen de katıl.
        cta:
            heading: <logo/> kurulumu <highlight>bedava</highlight>
            body:
                1: "Kullanıcıların %97'si bize 5 kuruş ödemiyor"
                2: Kredi kartı gerekmez
                3: Kurulum sihirbazı PostHog'u senin yerine kurar
            button:
                1: Hemen başla
                2:
                    label: AI ile kur
                    body: 'Terminalci misin? Tarayıcıyı boş ver:'

    section:
        2:
            carousel:
                pause: Karuseli durdur
                resume: Karuseli devam ettir
        2a:
            toggle: PostHog'a ne istersen sor
            heading: PostHog'a ne istersen sor
            body:
                1: PostHog, ürün ve şirket verilerini toplayıp saklayacağın ve sorgulayacağın tek yer. Analitik, oturum kayiıları, hatalar ve loglar anında birleşip aklına gelen her soruyu cevaplıyor.
                2: Tabloyu tamamlamak için <link>{count}+ kaynaktan</link> üçüncü taraf verisi çek.
            button: Ücretsiz başla
            products:
                more: ve <count/> tane daha
                caption: "{products} agent'larını besliyor."
                label: PostHog araçları
                view_all: '{count} aracın hepsini gör'
            demo:
                label: PostHog AI demosu
                description: "Örnek demo: PostHog AI, Google Ads trafiğini, PostHog huni analizlerini, Stripe ödemelerini ve GitHub değişikliklerini kullanarak ücretli dönüşümlerdeki düşüşü inceliyor. Mobil checkout'ta fazladan eklenmiş zorunlu bir alan buluyor ve daha kısa bir checkout'u test etmeyi öneriyor. Tüm bulgular örnek veridir."
                prompt: Signup'lar artıyor ama ücretli dönüşümler neden düşüyor?
                reply:
                    1: Reklam tıklamasından ödeme yapan müşteriye kadar tüm yolu takip edeceğim.
                    2: Düşüş ödemeden önce başlıyor.
                    3: Yeni eklenen zorunlu bir alan, mobil checkout'ta müşteri kaçırıyor.
                    4: Daha kısa bir mobil checkout'u test et.
                step:
                    1:
                        body: Kampanya trafiğini karşılaştır
                        result: Daha çok ziyaretçi, aynı kitle
                    2:
                        body: Signup → ödeme yolunu analiz et
                        result: Kopuş mobil checkout'ta
                    3:
                        body: Ödemeleri ve reddedilenleri kontrol et
                        result: Reddedilen ödemelerde değişiklik yok
                    4:
                        body: Checkout'taki son değişiklikleri incele
                        result: Zorunlu bir alan eklenmiş

        2b:
            toggle: Agent'larına ürün bağlamı ver
            heading: Agent'larına ürün bağlamı ver
            body: Tarayıcıya geçip durmak yerine ürün verilerini doğrudan editöründen sorgula. Tek seferlik analizlerden yeni feature çıkarmaya kadar her şeyi yap. Yeni bir arayüze gerek yok.
            cta:
                label: PostHog MCP'sini kur
                alt: Ya da <link>PostHog Desktop</link> kullan
            demo:
                agents: Agent'ların

        2c:
            toggle: PostHog'la canlıya al
            heading: PostHog'la canlıya al
            body: PostHog ilgili bulguları araştırılmış raporlarda toplar ve önceliğe göre sıralar. Önerilen iyileştirmeleri ve pull request'leri incele, neyin canlıya çıkacağına sen karar ver.
            button: Ücretsiz başla
            signals:
                heading: 'Otonom sinyalleri şuralardan çeker:'
                1:
                    body: Issue olarak gruplanmış exception'lar ve stack trace'ler
                2:
                    body: Dead click'ler, hemen geri dönenler, uzun donmalar
                3:
                    title: Destek
                    body: Kullanıcılarından gelen talepler ve konuşmalar
                4:
                    title: Dış araçlar
                    body: Zendesk, Linear, GitHub issue'ları
            demo:
                description: "Örnek otonom inbox. Dört örnek rapor, en yenisi en üstte olacak şekilde tek tek geliyor: GitHub'dan bir fatura talebi, taslak pull request'i olan bir dönüşüm takibi scout'u, session replay'den bir checkout sorunu ve incelemeye hazır pull request'iyle yüksek öncelikli bir giriş hatası."

        3:
            heading: Müşteri Yorumları
            body: Evet, bizi gerçekten kullanıyorlar. Hayır, 2 yıl önce bizi bir kere deneyip bırakan rastgele bir mühendisten bahsetmiyoruz.
            button: Müşterileri gör
            shuffle: Karıştır
            logo:
