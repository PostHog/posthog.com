        8:
            heading: Utanmaz CTA
            body: Buraya kadar hiçbir şey seni PostHog'a ikna etmediyse, belki bu klasik teleshop taktikleri eder.
            box:
                badge: Çevre dostu
                subtitle: Dijital indirme*
            sticker:
