                story: Müşteri hikâyesini oku
            breakdown:
                colorful:
                    col1: Renkli logolar
                    col2: '"Şık" logolar'
                hardware:
                    col1: Donanım şirketleri
                    col2: Donanımla işi yok
                planes:
                    col1: Uçak yapıyor
                    col2: Uçak yapmıyor (şimdilik)
                caseStudy:
                    col1: PostHog case study'si olanlar
                    col2: Case study yapması gerekenler
                easyToYell:
                    col1: Tribünden bağırılabilir
                    col2: Nefes kontrolü ister
                goodBandName:
                    col1: İyi grup adı olur
                    col2: İlaç adı gibi duruyor
                explainable:
                    col1: Annene anlatabilirsin
                    col2: Annen "kripto mu o?" der
                shortNames:
