                    col1: PostHog kullanıyor
                    col2: Bunlar da PostHog kullanıyor

        4:
            heading: Tüm verilerin <highlight>aynı takımda</highlight>
            list:
                heading: 'Context warehouse kutudan şunlarla <highlight>çıkıyor</highlight>:'
                1: Bir data warehouse <tooltip/>
                2: 120+ kaynak/hedef
                3: SQL editörü + BI + veri görselleştirme
                4: Kullanıcı aktivite akışı (CDP-lite)
                5: API, webhook'lar
            # Markdown. Keep the formatting.
            body:
                1: İster müşteri kullanımını analiz et ister yapay zekâya iş yaptır, *tam* bağlamla çalışmalısın.
                2: "Her şeyi PostHog'un context warehouse'unda birleştir. Böylece sen de, agent'ların da, dashboard'un da her şeyi doğrudan sorgulayabilir. Buna şunlar da dahil:"
                list:
                    1: Stripe, Postgres ve HubSpot gibi 120+ harici kaynaktan veriler
                    2: Session Replays ve Experiments gibi diğer tüm PostHog araçlarından içgörüler
                3: Agent'larının iyi karar vermesi için gereken veriler zaten burada. "Ne oldu, anlat" sorusunu "sırada bunu düzelt" cevabına çevirmeye hazır mısın?
            tooltip: Kendi kaynağını da bağlayabilirsin!
            button: İlk veri kaynağını bağla

        5:
            heading: Kullandıkça öde
            # Markdown. Keep the formatting.
            body:
                1: 'Felsefemiz basit: fiyatı dert etmek zorunda kalmamalısın.'
                2: Tüm ücretli ürünlerimiz kullandıkça öde modelinde ve her ay cömert ücretsiz kotalarla geliyor. Hatta müşterilerimizin %98'i PostHog'u bedavaya kullanıyor.
                3: Ölçek büyüdükçe en ucuz seçenekle aynı fiyatı hedefliyoruz. PostHog'u seçmek için düşünmeye bile gerek olmamalı. Fiyatı öğrenmek için asla "müşteri temsilcisine bağlanmak için 9'u tuşlaman" gerekmez.
                4: 'En popüler ürünlerimizi nasıl ücretlendirdiğimize birkaç örnek:'
            label:
