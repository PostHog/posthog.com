# Brazilian Portuguese. Keys match en.yml. A key that is not here shows the English text.
name: Português (Brasil)
# The BCP 47 tag for <html lang> and hreflang. The URL stays /pt.
lang: pt-BR
messages:
    meta:
        title: PostHog - a camada de contexto do seu produto
        description: O PostHog diagnostica problemas, corrige bugs e gera pull requests automaticamente, sem que você precise pedir.

    hero:
        H1: A <emphasis>camada de contexto</emphasis> do seu produto
        body:
            1: O PostHog coleta e armazena seus <highlight>analytics, erros, replays e dados de negócio</highlight> para que você e seus <underline>agentes</underline> possam consultá-los e agir a partir deles.
            2: Junte-se a mais de 500.000 equipes que já lançam produtos com o PostHog.
        cta:
            heading: Configure o <logo/> <highlight>de graça</highlight>
            body:
                1: 97% dos usuários não pagam nada
                2: Sem cartão de crédito
                3: O assistente de configuração instala o PostHog para você
            button:
                1: Começar
                2:
                    label: Instalar com IA
                    body: 'Prefere o terminal? Pule o navegador:'

    section:
        2:
            carousel:
                pause: Pausar carrossel
                resume: Retomar carrossel
        2a:
            toggle: Pergunte qualquer coisa ao PostHog
            heading: Pergunte qualquer coisa ao PostHog
            body:
                1: O PostHog é o único lugar para coletar, armazenar e consultar os dados do seu produto e da sua empresa. Analytics, replays, erros e logs, conectados na hora para responder qualquer pergunta que você tiver.
                2: Traga dados de terceiros de <link>mais de {count} fontes</link> para ter uma visão mais completa.
            button: Comece de graça
            products:
                more: e mais <count/>
                caption: '{products} alimentam seus agentes.'
                label: Ferramentas do PostHog
                view_all: Ver todas as {count} ferramentas
            demo:
                label: Demonstração do PostHog AI
                description: 'Demonstração ilustrativa: o PostHog AI investiga a queda nas conversões pagas usando o tráfego do Google Ads, os funis do PostHog, os pagamentos do Stripe e as mudanças no GitHub. Ele encontra um campo obrigatório a mais no checkout mobile e recomenda testar um checkout mais curto. Todos os resultados são dados de exemplo.'
                welcome: Como posso ajudar?
                composer:
                    context: Adicionar contexto
                    placeholder: Descreva a tarefa em detalhes...
                    mode: Auto
                    model: Padrão
                sample_data: Dados de exemplo
                capability:
                    coding: Programação
                    sdk_setup: Configuração de SDK
                    docs: Documentação
                prompt: Por que os cadastros estão crescendo, mas as conversões pagas estão caindo?
                reply:
                    1: Vou rastrear o caminho do clique no anúncio até o cliente pagante.
                    2: A queda começa antes do pagamento.
                    3: Um novo campo obrigatório está fazendo clientes desistirem no checkout mobile.
                    4: Teste um checkout mobile mais curto.
                step:
                    1:
                        body: Comparar o tráfego das campanhas
                        result: Mais visitantes, mesmo público
                    2:
                        body: Analisar o funil de cadastro → pagamento
                        result: Abandono no checkout mobile
                    3:
                        body: Verificar pagamentos e recusas
                        result: As recusas de pagamento não mudaram
                    4:
                        body: Revisar as mudanças recentes no checkout
                        result: Um campo obrigatório foi adicionado

        2b:
            toggle: Dê contexto de produto aos agentes
            heading: Dê contexto de produto aos agentes
            body: Consulte os dados do produto direto do seu editor, sem ficar trocando de aba no navegador. Faça de tudo, de análises pontuais ao lançamento de novas features, sem precisar de uma nova interface.
            cta:
                label: Instalar o PostHog MCP
                alt: Ou use o <link>PostHog Desktop</link>
            demo:
                agents: Seus agentes

        2c:
            toggle: Lance com o PostHog
            heading: Lance com o PostHog
            body: Seu Inbox agrupa descobertas relacionadas em relatórios pesquisados, ordenados por prioridade. Revise as melhorias e os pull requests propostos e depois decida o que vai para produção.
            button: Comece de graça
            signals:
                heading: 'O Self-driving coleta sinais de:'
                1:
                    body: Exceções e stack traces agrupados em issues
                2:
                    body: Cliques mortos, voltas rápidas, travamentos longos
                3:
                    title: Suporte
                    body: Tickets e conversas dos seus usuários
                4:
                    title: Ferramentas externas
                    body: Issues do Zendesk, Linear e GitHub
            demo:
                description: 'Inbox self-driving ilustrativo. Quatro relatórios de exemplo chegam um por vez, do mais novo para o mais antigo: um pedido sobre faturas vindo do GitHub, um scout de tracking de conversão com um pull request em rascunho, um problema de checkout vindo do session replay e um erro de login de alta prioridade com um pull request pronto para revisão.'
                empty:
                    heading: Seu inbox está vazio
                    body: Novas descobertas vão aparecer aqui.
                card:
                    1:
                        title: Facilitar o acesso às faturas
                        body: Os clientes vivem perguntando onde baixar as faturas. Adicione um link direto na página da conta.
                    2:
                        title: Restaurar o tracking de conversão do checkout
                        body: O novo checkout parou de enviar os eventos de conclusão. Restaure o tracking para o funil ficar correto.
                        source: Tracking de conversão
                    3:
                        title: Explicar por que um pagamento foi recusado
                        body: Os replays mostram clientes tentando o mesmo cartão de novo. Troque o erro genérico por uma mensagem útil.
                    4:
                        title: Corrigir falhas de login no mobile
                        body: Um token expirado deixa usuários mobile numa tela em branco. Atualize a sessão antes de redirecionar.
                timestamp: Agora mesmo

        3:
            heading: Prova social
            body: Sim, eles usam a gente de verdade. Não, não é só um engenheiro qualquer que testou a gente há mais de 2 anos.
            button: Ver clientes
            shuffle: Embaralhar empresas
            logo:
                first_customer: Primeiro cliente do PostHog!
                story: Leia a história do cliente
            breakdown:
                colorful:
                    col1: Logos coloridos
                    col2: 'Logos "elegantes"'
                hardware:
                    col1: Empresas de hardware
                    col2: Empresas que não são de hardware
                planes:
                    col1: Constrói aviões
                    col2: Não constrói aviões (ainda)
                caseStudy:
                    col1: Empresas com estudos de caso do PostHog
                    col2: Empresas que deveriam fazer estudos de caso
                easyToYell:
                    col1: Nomes fáceis de gritar
                    col2: Nomes que exigem controle de respiração
                goodBandName:
                    col1: Bons nomes de banda
                    col2: Poderiam ser confundidos com remédios
                explainable:
                    col1: Empresas que você consegue explicar para os seus pais
                    col2: Empresas que os seus pais nunca vão entender
                shortNames:
                    col1: Nomes com 7 letras ou menos
                    col2: Nomes fáceis de digitar errado
                realWords:
                    col1: Palavras de verdade
                    col2: Palavras que não existem
                american:
                    col1: Fundadas nos EUA
                    col2: Não fundadas nos EUA
                pokemon:
                    col1: Poderia ser um Pokémon
                    col2: Poderia ser um vilão do 007
                arr:
                    col1: Medido em ARR
                    col2: Medido em PIB
                devTool:
                    col1: Devtool da moda
                    col2: Da moda, mas não é devtool
                usesPostHog:
                    col1: Usa PostHog
                    col2: Também usa PostHog

        4:
            heading: Todos os seus dados, <highlight>trabalhando juntos</highlight>
            list:
                heading: 'Por padrão, o context warehouse <highlight>vem</highlight> com:'
                1: Um data warehouse <tooltip/>
                2: Mais de 120 fontes/destinos
                3: SQL editor + BI + visualização de dados
                4: Feed de atividade dos usuários (CDP-lite)
                5: API, webhooks
            # Markdown. Keep the formatting.
            body:
                1: Seja analisando o uso dos clientes ou direcionando uma IA, você deveria trabalhar com o contexto *completo*.
                2: 'Junte tudo no context warehouse do PostHog para que você, seus agentes e seu dashboard possam consultar tudo diretamente. Isso inclui:'
                list:
                    1: Dados de mais de 120 fontes externas, como Stripe, Postgres e HubSpot
                    2: Insights de todas as outras ferramentas do PostHog, como Session Replays e Experiments
                3: Os dados que seus agentes precisam para tomar boas decisões já estão aqui. Pronto para transformar "me conta o que aconteceu" em "é isso que você precisa corrigir agora"?
            tooltip: Você também pode conectar o seu!
            button: Conecte sua primeira fonte de dados

        5:
            heading: Preço por uso
            # Markdown. Keep the formatting.
            body:
                1: Nossa filosofia é que você não deveria ter que se preocupar com preço.
                2: Todos os nossos produtos pagos cobram por uso e têm planos gratuitos generosos todo mês. Na real, 98% dos nossos clientes usam o PostHog de graça.
                3: Queremos ter o preço da opção mais barata em escala. O PostHog tem que ser uma escolha óbvia. Você nunca vai precisar "marcar uma call rapidinha" com vendas.
                4: 'Alguns exemplos de como cobramos pelos produtos mais populares:'
            label:
                freetier: Plano gratuito
                pricing: Preço
                product: Produto
                pricing_table: Preço (diminui com o volume)
            product:
                1:
                    freetier: 1 milhão de eventos/mês
                    pricing: US$ 0,00005/evento
                2:
                    freetier: 5.000 gravações/mês
                    pricing: US$ 0,005/gravação
                3:
                    freetier: 1 milhão de requisições/mês
                    pricing: US$ 0,0001/requisição
                4:
                    freetier: 1 milhão de linhas/mês
                    pricing: US$ 0,000015/linha
            button: Ver preços

        6:
            heading: Por que o PostHog?
            body: 'Somos diferentes da maioria das empresas por vários motivos:'
            list:
                # Markdown. Keep the links.
                1: '**Transparência.** Você pode ler nosso [handbook da empresa](/handbook), nosso [manual de vendas](/handbook/growth/sales/overview) e a [estratégia da empresa](/handbook/why-does-posthog-exist).'
                2: '**Lançamos rápido.** Veja nosso [changelog](/changelog).'
                3: <bold>Suporte</bold> <emphasis>realmente</emphasis><bold> técnico.</bold> Todo o nosso <team>pessoal de suporte</team> tem formação em engenharia.
            button: Saiba mais sobre a gente

        7:
            heading: Leitura antes de dormir
            body: 'Ainda por aqui? Separamos uns links que podem ser levemente interessantes para você:'
            link:
                2: Documentação técnica
                3: API
                4: Faça uma pergunta
                5: Times pequenos no PostHog

        8:
            heading: CTA descarado
            body: Se nada até agora te convenceu a usar o PostHog, talvez essas táticas clássicas de marketing convençam.
            box:
                badge: Ecológico
                subtitle: Download digital*
            sticker:
                1: O pessoal do G2 acha a gente incrível
                2: <small>Não</small> tem o apoio<br/>da Kim K
            cart:
                label: 3 pessoas <small>(teriam)</small> adicionado o PostHog ao carrinho*
                footnote: '*se este fosse um carrinho de verdade'
            footnote: '*O PostHog é um produto web e não pode ser instalado por CD.<br/>Uma vez a gente <emphasis>chegou</emphasis> a mandar um disquete para alguns clientes, mas era um Rickroll.'
            cloud:
                heading: Escolha sua nuvem
                option:
                    1: EUA (Virgínia)
                    2: UE (Frankfurt)
            price:
                label: 'A partir de:'
                old: US$ 0
                new: Grátis
                urgency: '><larger>1 restante por esse preço!!</larger>'
            button: Começar
            urgency:
                label: '<bold>Corra:</bold> {companies} empresas se cadastraram <today>hoje</today>. <br/>Aja agora e ganhe US$ 0 de desconto no seu primeiro pedido.'
                fallback: Um monte de

    cookie:
        heading: Banner de cookies exigido por lei
        body:
            1: O PostHog.com não usa cookies de terceiros, só um único cookie próprio.
            2: Nenhum dado é enviado para terceiros. (A <tooltip>Ursula von der Leyen</tooltip> ficaria tão orgulhosa.)
        tooltip:
            label: Ursula von der Leyen é a presidente da Comissão Europeia. NÃO confundir com Hillary Clinton.
            image:
                alt: Ursula von der Leyen, presidente da Comissão Europeia
        close: Fechar

