# Korean. Keys match en.yml. A key that is not here shows the English text.
#
# Style rules for this locale. Follow them when you add or change a translation, and add a rule
# here when a review comment applies to more than one string. See the translate skill in
# .claude/skills/translate and src/i18n/README.md.
#
# - Sober and polite, but friendly. Use 해요체 for all body copy ("무료로 써요", "확인해 보세요"). Do not
#   use 합니다체 or 반말, and do not mix levels in one string.
# - Headings, toggles, buttons, and menu labels use short noun endings or -기: "요금 보기",
#   "PostHog를 쓰는 이유", "클라우드 선택". Not "요금을 살펴보세요".
# - Do not use "당신". Drop the pronoun, or use "여러분" when the sentence needs one. PostHog speaks of
#   itself as "저희" ("저희 철학은"), never "우리".
# - "PostHog" is read 포스트호그 and ends in a vowel: PostHog는, PostHog를, PostHog가, PostHog로, PostHog와.
#   "PostHog.com" is read 닷컴: PostHog.com은. A product takes 에 ("PostHog에 물어보기"). Max and agents take
#   에게 ("Max에게 묻기", "에이전트에게").
# - Keep the English tech words that Korean devs say, in Hangul: 풀 리퀘스트, 버그, 쿼리, 퍼널, 컨텍스트, 에이전트,
#   대시보드, 웹훅, 스택 트레이스, 데드 클릭. Keep acronyms in Latin letters (SDK, API, MCP, CTA). Keep product and
#   brand names in English (Session Replay, Inbox, context warehouse). Do not coin a word nobody uses.
# - Numbers: use 만 for large round numbers ("50만 개", "100만 건"), commas for the rest ("5,000개"), and a
#   period for decimals. Real prices stay in US dollars with the sign first: "이벤트당 $0.00005". Joke amounts
#   use won: "0원 할인".
# - Typography: no em dash. Use “ ” for quotes, no space before a parenthesis ("사용자 활동 피드(CDP-lite)"),
#   and standard 띄어쓰기 ("100만 개", "사용할 수 있어요").
# - Humor is gentle and understated. No slang, internet memes, or 반말. Localize a reference to one that a
#   Korean reader knows: Kim K -> 유재석, a Bond villain -> 아침 드라마 악역, "hop on a quick call" -> "견적 상담",
#   explaining to your parents -> explaining at 명절, a Rickroll -> a Rick Astley link.
# - Keep it short. Particles add length, so cut pronouns and "~하는 것" constructions.
name: 한국어
messages:
    meta:
        title: PostHog - 제품의 컨텍스트 레이어
        description: PostHog는 따로 요청하지 않아도 문제를 자동으로 진단하고, 버그를 고치고, 풀 리퀘스트까지 만들어요.

    hero:
        H1: 제품의 <emphasis>컨텍스트 레이어</emphasis>
        body:
            1: PostHog는 <highlight>분석 데이터, 오류, 리플레이, 비즈니스 데이터</highlight>를 모아서 저장해요. 여러분도, <underline>에이전트</underline>도 바로 쿼리하고 활용할 수 있어요.
            2: 이미 50만 개가 넘는 팀이 PostHog로 제품을 만들고 있어요.
        cta:
            heading: <logo/> <highlight>무료로</highlight> 설정하기
            body:
                1: 사용자 97%는 무료로 써요
                2: 신용카드 필요 없음
                3: 설치 마법사가 PostHog를 대신 설치해 드려요
            button:
                1: 시작하기
                2:
                    label: AI로 설치
                    body: '터미널이 더 편하세요? 브라우저 없이 바로:'

    section:
        2:
            carousel:
                pause: 캐러셀 일시정지
                resume: 캐러셀 재생
        2a:
            toggle: 무엇이든 물어보기
            heading: PostHog에 무엇이든 물어보기
            body:
                1: PostHog 한곳에서 제품 데이터와 회사 데이터를 수집하고, 저장하고, 쿼리할 수 있어요. 분석, 리플레이, 오류, 로그를 그때그때 엮어서 어떤 질문에든 답해요.
                2: <link>{count}개 이상의 소스</link>에서 외부 데이터를 가져와서 전체 그림을 더 정확하게 볼 수 있어요.
            button: 무료로 시작하기
            products:
                more: 외 <count/>개
                caption: '{products} 데이터가 에이전트로 흘러가요.'
                label: PostHog 도구
                view_all: 도구 {count}개 모두 보기
            demo:
                label: PostHog AI 데모
                description: '예시 데모: PostHog AI가 Google Ads 트래픽, PostHog 퍼널, Stripe 결제, GitHub 변경 사항을 살펴보며 유료 전환이 줄어든 원인을 조사해요. 모바일 결제 화면에 새로 생긴 필수 입력 항목을 찾아내고, 결제 과정을 더 짧게 줄여서 테스트해 보라고 권해요. 모든 결과는 샘플 데이터예요.'
                prompt: 가입은 느는데 유료 전환은 왜 줄고 있을까요?
                reply:
                    1: 광고 클릭부터 결제 고객이 되기까지의 경로를 따라가 볼게요.
                    2: 하락은 결제 단계 전부터 시작돼요.
                    3: 새로 추가된 필수 입력 항목 때문에 모바일 결제에서 고객이 이탈하고 있어요.
                    4: 모바일 결제 과정을 더 짧게 줄여서 테스트해 보세요.
                step:
                    1:
                        body: 캠페인 트래픽 비교
                        result: 방문자는 늘고, 오디언스는 그대로
                    2:
                        body: 가입 → 결제 퍼널 분석
                        result: 모바일 결제에서 이탈
                    3:
                        body: 결제와 결제 거절 내역 확인
                        result: 결제 거절은 그대로
                    4:
                        body: 최근 결제 페이지 변경 사항 검토
                        result: 필수 입력 항목이 추가됨

        2b:
            toggle: 에이전트에게 제품 컨텍스트 제공
            heading: 에이전트에게 제품 컨텍스트 제공
            body: 브라우저로 넘어갈 필요 없이 에디터에서 바로 제품 데이터를 쿼리하세요. 일회성 분석부터 새 기능 출시까지, 새 UI 없이 전부 할 수 있어요.
            cta:
                label: PostHog MCP 설치
                alt: 또는 <link>PostHog Desktop</link> 사용하기
            demo:
                agents: 내 에이전트

        2c:
            toggle: PostHog로 출시하기
            heading: PostHog로 출시하기
            body: Inbox가 관련된 발견 사항을 조사 보고서로 묶고, 우선순위대로 정렬해요. 제안된 개선 사항과 풀 리퀘스트를 검토하고, 무엇을 출시할지 결정하세요.
            button: 무료로 시작하기
            signals:
                heading: 'Self-driving이 신호를 모으는 곳:'
                1:
                    body: 이슈별로 묶인 예외와 스택 트레이스
                2:
                    body: 데드 클릭, 바로 뒤로 가기, 오래 멈춘 화면
                3:
                    title: 고객 지원
                    body: 사용자가 보낸 티켓과 대화
                4:
                    title: 외부 도구
                    body: Zendesk, Linear, GitHub 이슈
            demo:
                description: '예시 Self-driving Inbox예요. 샘플 보고서 네 개가 최신순으로 하나씩 도착해요. GitHub에서 온 청구서 요청, 풀 리퀘스트 초안이 있는 전환 추적 스카우트, Session Replay에서 찾은 결제 문제, 검토할 풀 리퀘스트가 준비된 높은 우선순위의 로그인 오류예요.'

        3:
            heading: 사회적 증거
            body: 네, 정말 쓰고 있어요. 2년 전에 한 번 써 보고 만 엔지니어 한 명 얘기가 아니에요.
            button: 고객 보기
            shuffle: 회사 섞기
            logo:
                first_customer: PostHog의 첫 고객!
                story: 고객 사례 읽기
            breakdown:
                colorful:
                    col1: 알록달록한 로고
                    col2: '“세련된” 로고'
                hardware:
                    col1: 하드웨어 회사
                    col2: 하드웨어 회사 아님
                planes:
                    col1: 비행기를 만드는 회사
                    col2: 비행기는 (아직) 안 만드는 회사
                caseStudy:
                    col1: PostHog 고객 사례가 있는 회사
                    col2: 고객 사례를 써 주셨으면 하는 회사
                easyToYell:
                    col1: 외치기 쉬운 이름
                    col2: 숨을 고르고 불러야 하는 이름
                goodBandName:
                    col1: 인디 밴드 이름 같음
                    col2: 감기약 이름 같음
                explainable:
                    col1: 명절에 설명하기 쉬운 회사
                    col2: 명절마다 다시 설명해야 하는 회사
                shortNames:
                    col1: 7자 이하 이름
                    col2: 오타 나기 쉬운 이름
                realWords:
                    col1: 사전에 있는 단어
                    col2: 사전에 없는 단어
                american:
                    col1: 미국에서 창업
                    col2: 미국 밖에서 창업
                pokemon:
                    col1: 포켓몬 이름 같음
                    col2: 아침 드라마 악역 이름 같음
                arr:
                    col1: ARR로 측정
                    col2: GDP로 측정
                devTool:
                    col1: 요즘 뜨는 개발 도구
                    col2: 뜨긴 하지만 개발 도구는 아님
                usesPostHog:
                    col1: PostHog 사용 중
                    col2: 여기도 PostHog 사용 중

        4:
            heading: 모든 데이터가 <highlight>함께 일하는 곳</highlight>
            list:
                heading: 'context warehouse에 <highlight>기본으로</highlight> 들어 있는 것:'
                1: 데이터 웨어하우스 <tooltip/>
                2: 120개 이상의 소스/대상
                3: SQL 에디터 + BI + 데이터 시각화
                4: 사용자 활동 피드(CDP-lite)
                5: API, 웹훅
            # Markdown. Keep the formatting.
            body:
                1: 고객 사용 현황을 분석하든 AI에게 일을 맡기든, *전체* 컨텍스트를 갖고 일해야 해요.
                2: 'PostHog의 context warehouse에 모두 모으면 여러분과 에이전트, 대시보드가 바로 쿼리할 수 있어요. 여기에는 이런 데이터가 들어가요:'
                list:
                    1: Stripe, Postgres, HubSpot 등 120개 이상의 외부 소스 데이터
                    2: Session Replay, Experiments 등 다른 모든 PostHog 도구의 인사이트
                3: 에이전트가 좋은 결정을 내리는 데 필요한 데이터는 이미 여기 있어요. “무슨 일이 있었는지 알려 줘”를 “다음에 고칠 건 이거예요”로 바꿀 준비가 됐어요.
            tooltip: 직접 연결할 수도 있어요!
            button: 첫 데이터 소스 연결하기

        5:
            heading: 사용량 기반 요금
            # Markdown. Keep the formatting.
            body:
                1: 저희 철학은 간단해요. 요금 걱정은 하지 않으셔도 돼야 한다는 거예요.
                2: 모든 유료 제품은 쓴 만큼만 내는 방식이고, 매달 넉넉한 무료 사용량이 있어요. 실제로 고객의 98%는 PostHog를 무료로 써요.
                3: 규모가 커져도 가장 저렴한 선택지와 같은 가격을 목표로 해요. PostHog는 고민할 필요 없는 선택이어야 하니까요. 가격을 알아보려고 “견적 상담”을 신청하실 일도 없어요.
                4: '많이 쓰는 제품의 요금 예시예요:'
            label:
                freetier: 무료 사용량
                pricing: 요금
                product: 제품
                pricing_table: 요금(많이 쓸수록 저렴)
            product:
                1:
                    freetier: 이벤트 월 100만 개
                    pricing: 이벤트당 $0.00005
                2:
                    freetier: 녹화 월 5,000개
                    pricing: 녹화당 $0.005
                3:
                    freetier: 요청 월 100만 건
                    pricing: 요청당 $0.0001
                4:
                    freetier: 행 월 100만 개
                    pricing: 행당 $0.000015
            button: 요금 보기

        6:
            heading: PostHog를 쓰는 이유
            body: 'PostHog는 여러모로 다른 회사들과 달라요:'
            list:
                # Markdown. Keep the links.
                1: '**투명성.** [회사 핸드북](/handbook), [영업 매뉴얼](/handbook/growth/sales/overview), [회사 전략](/handbook/why-does-posthog-exist)까지 누구나 읽을 수 있어요.'
                2: '**빠른 출시.** [변경 로그](/changelog)를 확인해 보세요.'
                3: <emphasis>진짜</emphasis><bold> 기술 지원.</bold> <team>지원팀</team>은 모두 엔지니어 출신이에요.
            button: PostHog 더 알아보기

        7:
            heading: 자기 전에 읽을거리
            body: '아직 계세요? 조금은 흥미로울지도 모르는 링크를 모아 봤어요:'
            link:
                2: 기술 문서
                3: API
                4: 질문하기
                5: PostHog의 소규모 팀

        8:
            heading: 뻔뻔한 CTA
            body: 지금까지 보고도 마음이 움직이지 않으셨다면, 이 고전적인 마케팅 수법은 통하길 바라요.
            box:
                badge: 친환경
                subtitle: 디지털 다운로드*
            sticker:
                1: G2 사용자들이 저희를 좋아해요
                2: 유재석<br/>추천 <small>아님</small>
            cart:
                label: 3명이 PostHog를 장바구니에 담았<small>(을 거예요)</small>*
                footnote: '*진짜 장바구니였다면요'
            footnote: '*PostHog는 웹 제품이라 CD로 설치할 수 없어요.<br/>한번은 <emphasis>정말로</emphasis> 몇몇 고객에게 플로피 디스크를 보냈는데, 안에는 릭 애스틀리 노래 링크만 들어 있었어요.'
            cloud:
                heading: 클라우드 선택
                option:
                    1: 미국(버지니아)
                    2: 유럽(프랑크푸르트)
            price:
                label: '시작 가격:'
                old: 0원
                new: 무료
                urgency: 이 가격에 ><larger>1개 남음!!</larger>
            button: 시작하기
            urgency:
                # {companies} is today's signup count, or `fallback` when it is not loaded yet.
                label: '<bold>서두르세요:</bold> <today>오늘</today>만 {companies}개 기업이 가입했어요. <br/>지금 바로 첫 주문 0원 할인을 받으세요.'
                fallback: 수백

    cookie:
        heading: 법적으로 필요한 쿠키 배너
        body:
            1: PostHog.com은 서드파티 쿠키를 쓰지 않아요. 자체 쿠키 하나만 써요.
            2: 제3자에게는 어떤 데이터도 보내지 않아요. (<tooltip>우르줄라 폰데어라이엔</tooltip>도, 개인정보보호위원회도 뿌듯해할 거예요.)
