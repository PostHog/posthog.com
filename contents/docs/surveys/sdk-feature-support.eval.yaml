owner: surveys
tags: [surveys, sdk, compatibility, mobile]
status: active

checks:
    - id: cross-sdk-compatibility
      description: >-
          Baseline answer check: can an agent look up exact cross-SDK feature limits
          from the SDK feature support matrix without guessing? Prompt names features
          with sharp per-SDK differences.
      prompt: >-
          We want to ship one PostHog survey across Web, iOS, Android, React Native,
          and Flutter that uses URL targeting, action targeting, question shuffling,
          choice shuffling, and partial responses. What works on each SDK and
          what won't?
      criteria:
          shared: [docs-read]
          rubrics:
              web-only-features: >-
                  States that URL targeting (`posthog-js >= 1.82.0`) and action
                  targeting (`posthog-js >= 1.301.0`) work on Web only and are not
                  supported on React Native, iOS, Android, or Flutter.
              shuffle-distinction: >-
                  Distinguishes question shuffling (`posthog-js >= 1.131.5`,
                  `posthog-react-native >= 4.68.0`, unsupported on iOS/Android/Flutter)
                  from choice shuffling (supported across Web `1.131.5+`, React Native
                  `4.77.1+`, iOS `3.76.0+`, Android `3.66.0+`, and Flutter `5.44.1+`).
              partial-responses-floors: >-
                  States that partial responses are supported across all five SDKs
                  with minimum versions `posthog-js >= 1.240.0`, React Native
                  `4.75.0+`, iOS `3.79.0+`, Android `3.70.0+`, and Flutter `5.48.0+`.
              flutter-web-delegation: >-
                  Notes that Flutter Web delegates surveys to `posthog-js` (so web
                  feature support applies on Flutter Web rather than Flutter mobile
                  limits).
