owner: wizard-and-docs
tags: [python, flask, server]
status: active

checks:
    - id: tracing-headers-default
      description: >-
          Does the page give the current default for tracing headers? posthog 7 reads
          the PostHog distinct ID and session ID headers by default, and
          `capture_tracing_headers=False` turns that off. The page is linked, so a
          wrong page gives a wrong answer. The prompt does not name the option.
      append_docs_link: true
      prompt: >-
          I use PostHog's Flask integration. By default, does it use the distinct ID and
          session ID headers that my frontend sends? I want it to ignore them.
      criteria:
          shared: [docs-read]
          rubrics:
              default-is-on: >-
                  The answer says the integration reads the PostHog distinct ID and
                  session ID headers by default. Fails if it says the integration
                  ignores them by default.
              how-to-turn-off: >-
                  The answer turns the headers off with `capture_tracing_headers=False`
                  on the integration. Fails if it says no change is needed, or names
                  only `trust_tracing_headers`.
