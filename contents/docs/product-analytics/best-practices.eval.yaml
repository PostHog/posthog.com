version: 1
owner: product-analytics
tags: [concept, data-quality]
status: active

cases:
    - id: filter-internal-users
      task: |
          Our product analytics numbers in PostHog are inflated by our own
          team: people logging in with company emails, plus testing on
          localhost and our staging site. I also want to exclude my own
          browser when I browse our marketing site without logging in. How do
          I set this up?
      criteria:
          use: [answers-directly]
          settings-filter: >-
              The answer says to add filters under the project setting
              "Filter out internal and test users", and that a filter describes
              the traffic to keep, so it needs a negative operator such as
              "doesn't equal", "doesn't contain" or "doesn't end with" (for
              example person property `email` doesn't end with
              `@yourcompany.com`, and event property Host doesn't contain
              `localhost`).
          turn-filter-on: >-
              The answer says the filter must also be turned on where data is
              viewed: the "Filter out internal and test users" toggle on each
              insight (or the "Filter test accounts" switch in Web Analytics).
          own-browser: >-
              For the anonymous own-browser case, the answer says to call
              `posthog.setInternalOrTestUser()` (which sets the
              `$internal_or_test_user` person property) or
              `posthog.opt_out_capturing()` in that browser, and notes that an
              email filter alone only works for identified users.
