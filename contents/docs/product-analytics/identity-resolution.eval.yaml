version: 1
owner: product-analytics
tags: [instrumentation, nodejs, identity]
status: active

cases:
    - id: no-catch-all-distinct-id
      workspace:
          fixture: node-express
      pages:
          - docs/product-analytics/installation/nodejs
      task: |
          PostHog isn't set up yet in the API in {folder}/. The API has no user
          accounts. Capture server-side events when a todo is created,
          completed and deleted. We don't need person profiles for these and
          want to keep costs and ingestion problems down.
      criteria:
          use: [config-from-env, stays-in-folder]
          random-distinct-id: >-
              Each capture uses a generated distinct ID (for example
              `crypto.randomUUID()` per request), not one shared constant such
              as "system", "backend", "server" or "anonymous" across all
              events. Cite the capture calls in index.js.
          no-person-processing: >-
              Every capture call sets `$process_person_profile: false` in its
              `properties`.
