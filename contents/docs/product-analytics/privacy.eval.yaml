owner: product-analytics
tags: [instrumentation, javascript, privacy]
status: active

checks:
    - id: consent
      description: >-
          Baseline: can an agent set up consent-gated capture from a one-line request?
          The agent gets no docs, so docs-read shows which pages it finds on its own.
      codebase_to_test: web-vite
      prompt: >-
          Set up PostHog in the app in {folder}/ so nothing is captured until the user
          consents.
      criteria:
          shared: [builds, docs-read]
          rubrics:
              opted-out-by-default: >-
                  posthog.init is called with opt_out_capturing_by_default: true. Cite
                  the file and line.
              consent-toggle: >-
                  A consent control the agent adds calls posthog.opt_in_capturing() when
                  the user consents and posthog.opt_out_capturing() when consent is
                  withdrawn.
