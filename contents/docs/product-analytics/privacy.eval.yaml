owner: product-analytics
tags: [instrumentation, javascript, privacy]
status: active

checks:
    - id: opt-in-consent
      description: >-
          Checks that the privacy page teaches the agent to start opted out,
          wire a settings checkbox to the opt-in and opt-out calls, and strip
          the current URL with before_send. The prompt describes the consent
          behavior a user wants and never names those APIs.
      codebase_to_test: web-vite
      pages:
          - docs/product-analytics/installation/web
      prompt: &opt-in-consent-prompt |
          Add product analytics to the app in {folder}/, but nothing may be
          captured until a user agrees. Add a "Share usage analytics" checkbox
          to the Preferences section of the settings page
          ({folder}/src/pages/settings.js). It should be unchecked for new
          visitors, start capturing when checked, stop when unchecked, and
          reflect the current choice when the page loads. Also make sure the
          current URL is never sent with events. PostHog isn't set up yet.
          Only change files inside {folder}/. Read the project token and host
          from environment variables.
      append_docs_link: true
      criteria: &opt-in-consent-criteria
          shared: [config-from-env, stays-in-folder, builds]
          rubrics:
              opted-out-by-default: >-
                  posthog.init is called with opt_out_capturing_by_default: true.
                  Cite the file and line.
              consent-toggle: >-
                  The checkbox calls posthog.opt_in_capturing() when checked and
                  posthog.opt_out_capturing() when unchecked, and sets its initial
                  state from posthog.has_opted_out_capturing(). Cite the file and lines.
              strip-current-url: >-
                  posthog.init has a before_send function that removes or nulls
                  event.properties['$current_url'] and returns the event.

    - id: opt-in-consent-no-docs
      description: Same task as opt-in-consent, with no docs and nothing attached. Compare the two to see what the page adds.
      codebase_to_test: web-vite
      pages:
          - docs/product-analytics/installation/web
      prompt: *opt-in-consent-prompt
      criteria: *opt-in-consent-criteria
