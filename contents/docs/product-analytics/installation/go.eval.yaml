owner: wizard-and-docs
tags: [install, go]
status: active

checks:
    - id: install
      description: >-
          Tests whether the Go install page alone gets an agent to a posthog-go client
          that is configured from env and closed before exit. Runs in Gauge's
          starter-go, a bare net/http server.
      codebase_to_test: starter-go
      prompt: &install-prompt |
          The app in {folder}/ needs product analytics. Set up PostHog in it.
          Only change files inside {folder}/. Read the project token and host from environment variables rather than writing them into the code. Make sure the app still builds or starts without errors when you're done.
      append_docs_link: true
      criteria: &install-criteria
          shared: [config-from-env, stays-in-folder, builds]
          rubrics:
              has-posthog-go: >-
                  {folder}/go.mod lists `github.com/posthog/posthog-go` as a dependency.
              required-steps-done: >-
                  The app creates a client with posthog.NewWithConfig, passing the project token and a posthog.Config whose Endpoint is the PostHog host, and closes the client before exit (for example defer client.Close()). Cite the file and line(s).

    - id: install-no-docs
      description: Same task as install, with no docs and nothing attached. Compare the two to see what the page adds.
      codebase_to_test: starter-go
      prompt: *install-prompt
      criteria: *install-criteria

    - id: install-content-and-mcp
      description: Same task as install, with the full page in the prompt and the PostHog MCP attached.
      codebase_to_test: starter-go
      prompt: *install-prompt
      append_docs_content: true
      attach_mcp: posthog
      criteria: *install-criteria

    - id: install-skill # placeholder: skipped until skills are built
      description: Same task as install, with this page attached as a skill instead of in the prompt.
      codebase_to_test: starter-go
      prompt: *install-prompt
      attach_skill: true
      criteria: *install-criteria
