version: 1
owner: wizard-and-docs
tags: [install, android]
status: active

cases:
    - id: install
      workspace:
          fixture: android-app
      task: |
          The app in {folder}/ needs product analytics. Set up PostHog in it.
          Only change files inside {folder}/. Read the project token and host from the app's build configuration rather than hard-coding them in source. Make sure the app still builds or starts without errors when you're done.
      criteria:
          use: [config-from-env, stays-in-folder, builds]
          sdk-installed: >-
              {folder}/app/build.gradle.kts declares the com.posthog:posthog-android dependency, directly or through an entry in {folder}/gradle/libs.versions.toml.
          required-steps-done: >-
              PostHog is set up in an Application subclass's onCreate: it builds PostHogAndroidConfig with apiKey (the project token) and host (the PostHog host) and calls PostHogAndroid.setup(this, config). The app has no Application class to start with, so the new class must be registered with android:name on the <application> element in {folder}/app/src/main/AndroidManifest.xml. Cite the file and line(s).
