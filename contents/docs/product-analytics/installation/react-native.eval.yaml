owner: wizard-and-docs
tags: [install, javascript, react-native, mobile]
status: active

checks:
    - id: install
      description: >-
          Tests whether the React Native install page alone gets an agent to wrap a bare
          (non-Expo) app in PostHogProvider and add the native peer dependencies it
          needs.
      codebase_to_test: react-native-app
      prompt: &install-prompt |
          The app in {folder}/ needs product analytics. Set up PostHog in it.
          Only change files inside {folder}/. Read the project token and host from
          environment variables rather than writing them into the code. Make sure the
          app still builds or starts without errors when you're done.
      append_docs_link: true
      criteria: &install-criteria
          shared: [config-from-env, stays-in-folder, builds]
          rubrics:
              has-posthog-react-native: >-
                  {folder}/package.json lists `posthog-react-native` as a dependency.
              has-react-native-async-storage-async-storage: >-
                  {folder}/package.json lists `@react-native-async-storage/async-storage` as a dependency.
              has-react-native-device-info: >-
                  {folder}/package.json lists `react-native-device-info` as a dependency.
              has-react-native-localize: >-
                  {folder}/package.json lists `react-native-localize` as a dependency.
              required-steps-done: >-
                  The app's root component (for example in {folder}/src/App.js or
                  {folder}/src/index.js) is wrapped in PostHogProvider imported from
                  posthog-react-native, with the project token passed as apiKey and
                  the host passed as options.host. Cite the file and line(s).

    - id: install-no-docs
      description: Same task as install, with no docs and nothing attached. Compare the two to see what the page adds.
      codebase_to_test: react-native-app
      prompt: *install-prompt
      criteria: *install-criteria

    - id: install-mcp
      description: Same task as install, with no docs in the prompt and the PostHog MCP attached.
      codebase_to_test: react-native-app
      prompt: *install-prompt
      attach_mcp: posthog
      criteria: *install-criteria

    - id: install-skill # placeholder: skipped until skills are built
      description: Same task as install, with this page attached as a skill instead of in the prompt.
      codebase_to_test: react-native-app
      prompt: *install-prompt
      attach_skill: true
      criteria: *install-criteria
