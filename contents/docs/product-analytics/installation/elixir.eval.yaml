owner: wizard-and-docs
tags: [install, elixir]
status: draft

checks:
    - id: install
      description: >-
          Tests whether the Elixir install page alone gets an agent to a working posthog
          Elixir setup with config from env. Draft until the elixir-app fixture exists.
      codebase_to_test: elixir-app
      prompt: &install-prompt |
          The app in {folder}/ needs product analytics. Set up PostHog in it.
          Only change files inside {folder}/. Read the project token and host from environment variables rather than writing them into the code. Make sure the app still builds or starts without errors when you're done.
      append_docs_link: true
      criteria: &install-criteria
          shared: [config-from-env, stays-in-folder, builds]
          rubrics:
              sdk-installed: >-
                  {folder}/mix.exs lists {:posthog, "~> 2.0"} (or a compatible posthog version) in deps.
              required-steps-done: >-
                  The app configures :posthog with api_key (the project token) and api_host (the PostHog host), for example in config/config.exs or config/runtime.exs. Cite the file and line(s).

    - id: install-no-docs
      description: Same task as install, with no docs and nothing attached. Compare the two to see what the page adds.
      codebase_to_test: elixir-app
      prompt: *install-prompt
      criteria: *install-criteria

    - id: install-mcp
      description: Same task as install, with no docs in the prompt and the PostHog MCP attached.
      codebase_to_test: elixir-app
      prompt: *install-prompt
      attach_mcp: posthog
      criteria: *install-criteria

    - id: install-skill # placeholder: skipped until skills are built
      description: Same task as install, with this page attached as a skill instead of in the prompt.
      codebase_to_test: elixir-app
      prompt: *install-prompt
      attach_skill: true
      criteria: *install-criteria
