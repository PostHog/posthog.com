version: 1
owner: wizard-and-docs
tags: [install, python]
status: active

cases:
    - id: install
      workspace:
          fixture: python-stdlib
      task: |
          The app in {folder}/ needs product analytics. Set up PostHog in it.
          Only change files inside {folder}/. Read the project token and host from environment variables rather than writing them into the code. Make sure the app still builds or starts without errors when you're done.
      criteria:
          use: [config-from-env, stays-in-folder, builds]
          sdk-installed: >-
              {folder}/requirements.txt lists posthog.
          required-steps-done: >-
              The app imports Posthog from the posthog package and creates a Posthog client with project_api_key set to the project token and host set to the PostHog host, for example in {folder}/server.py. Cite the file and line(s).
