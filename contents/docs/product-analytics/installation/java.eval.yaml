owner: wizard-and-docs
tags: [install, java]
status: draft

checks:
    - id: install
      description: >-
          Tests whether the Java install page alone gets an agent to a posthog-server
          client that is configured from env and flushed and closed on shutdown. Draft
          until the java-app fixture exists.
      codebase_to_test: java-app
      prompt: |
          The app in {folder}/ needs product analytics. Set up PostHog in it.
          Only change files inside {folder}/. Read the project token and host from environment variables rather than writing them into the code. Make sure the app still builds or starts without errors when you're done.
      criteria:
          shared: [config-from-env, stays-in-folder, builds]
          rubrics:
              sdk-installed: >-
                  {folder}/pom.xml or {folder}/build.gradle declares the com.posthog:posthog-server dependency.
              required-steps-done: >-
                  The app builds a config with PostHogConfig.builder(<project token>).host(<PostHog host>).build(), creates the client with PostHog.with(config), and calls flush() and close() on the client when the app shuts down. Cite the file and line(s).
