owner: wizard-and-docs
tags: [install, javascript, react, react-router]
status: active

checks:
    - id: install
      description: >-
          Baseline: can an agent set up PostHog in a React Router 7 app from a one-line
          request? The agent gets no docs, so docs-read shows which pages it finds on
          its own.
      codebase_to_test: react-router-7
      prompt: >-
          Set up PostHog in the React Router app in {folder}/.
      criteria:
          shared: [builds, docs-read]
          rubrics:
              sdk-installed: >-
                  {folder}/package.json lists `posthog-js` and `@posthog/react`.
              ssr-and-provider: >-
                  {folder}/vite.config.ts adds 'posthog-js' and '@posthog/react' to
                  ssr.noExternal, and the app is wrapped in PostHogProvider on the
                  client with the project token and api_host. Cite the file and line(s).
