owner: wizard-and-docs
tags: [install, javascript, react, react-router]
status: active

checks:
    - id: install
      description: >-
          Tests whether the React Router install page alone gets an agent through the
          framework-mode steps on a React Router 7 app: the ssr.noExternal change and a
          new entry.client.tsx with PostHogProvider.
      workspace:
          fixture: react-router-7
      prompt: |
          The app in {folder}/ needs product analytics. Set up PostHog in it.
          Only change files inside {folder}/. Read the project token and host from
          environment variables rather than writing them into the code. Make sure the
          app still builds or starts without errors when you're done.
      criteria:
          shared: [config-from-env, stays-in-folder, builds]
          assertions:
              - dependency: posthog-js
              - dependency: '@posthog/react'
          rubrics:
              required-steps-done: >-
                  Both of these are done. (1) {folder}/vite.config.ts adds
                  'posthog-js' and '@posthog/react' to ssr.noExternal. The app's
                  config already sets noExternal to true for builds and to ['gsap']
                  otherwise, so the two packages must be added to that list (or
                  noExternal otherwise made to cover them in dev). (2) An
                  {folder}/app/entry.client.tsx file (the app has none to start with,
                  so it must be created) calls posthog.init from posthog-js with the
                  project token and an api_host option, and wraps the hydrated
                  <HydratedRouter /> in PostHogProvider from @posthog/react with
                  client={posthog}. Cite the files and lines.
              uses-defaults: >-
                  The posthog.init options include a defaults option set to a date
                  string (the current recommended value is '2026-08-30'). Cite the
                  file and line(s).
