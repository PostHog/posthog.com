owner: wizard-and-docs
tags: [install, kmp]
status: draft

checks:
    - id: install
      description: >-
          Tests whether the Kotlin Multiplatform install page alone gets an agent to set
          up posthog-kmp once per target with the right PostHogContext. Draft until the
          kmp-app fixture exists.
      codebase_to_test: kmp-app
      prompt: &install-prompt |
          The app in {folder}/ needs product analytics. Set up PostHog in it.
          Only change files inside {folder}/. Read the project token and host from the app's build configuration rather than hard-coding them in source. Make sure the app still builds or starts without errors when you're done.
      append_docs_link: true
      criteria: &install-criteria
          shared: [config-from-env, stays-in-folder, builds]
          rubrics:
              sdk-installed: >-
                  The shared module's build.gradle.kts in {folder}/ adds com.posthog:posthog-kmp to the commonMain dependencies.
              required-steps-done: >-
                  The app calls PostHog.setup() once, early in its lifecycle, with PostHogConfig(apiKey = <project token>, host = <PostHog host>) and a PostHogContext. On Android, setup runs in an Application subclass's onCreate with PostHogContext(this) and that class is registered with android:name in AndroidManifest.xml; on iOS, web and JVM targets it uses the no-argument PostHogContext(). Cite the file and line(s).

    - id: install-no-docs
      description: Same task as install, with no docs and nothing attached. Compare the two to see what the page adds.
      codebase_to_test: kmp-app
      prompt: *install-prompt
      criteria: *install-criteria

    - id: install-mcp
      description: Same task as install, with no docs in the prompt and the PostHog MCP attached.
      codebase_to_test: kmp-app
      prompt: *install-prompt
      attach_mcp: posthog
      criteria: *install-criteria

    - id: install-skill # placeholder: skipped until skills are built
      description: Same task as install, with this page attached as a skill instead of in the prompt.
      codebase_to_test: kmp-app
      prompt: *install-prompt
      attach_skill: true
      criteria: *install-criteria
