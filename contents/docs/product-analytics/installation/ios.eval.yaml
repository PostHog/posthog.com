version: 1
owner: wizard-and-docs
tags: [install, ios]
status: active

cases:
    - id: install
      workspace:
          fixture: ios-app
      task: |
          The app in {folder}/ needs product analytics. Set up PostHog in it.
          Only change files inside {folder}/. Read the project token and host from the app's build configuration rather than hard-coding them in source. Make sure the app still builds or starts without errors when you're done.
      criteria:
          use: [config-from-env, stays-in-folder, builds]
          sdk-installed: >-
              The PostHog iOS SDK is added as a dependency: a Swift Package reference to https://github.com/PostHog/posthog-ios.git in {folder}/Hackers.xcodeproj/project.pbxproj, or pod "PostHog" in a Podfile.
          required-steps-done: >-
              The app imports PostHog, creates PostHogConfig(projectToken:host:) with the project token and PostHog host, and calls PostHogSDK.shared.setup(config) at launch, for example in application(_:didFinishLaunchingWithOptions:) in {folder}/App/AppDelegate.swift. Cite the file and line(s).
