owner: wizard-and-docs
tags: [install, javascript, react]
status: active

checks:
    - id: install
      description: >-
          Tests whether the React install page alone gets an agent to wrap a Vite React
          app in PostHogProvider, with config from VITE_ env variables and the
          recommended defaults.
      workspace:
          fixture: react-vite
      prompt: |
          The app in {folder}/ needs product analytics. Set up PostHog in it.
          Only change files inside {folder}/. Read the project token and host from
          environment variables rather than writing them into the code. Make sure the
          app still builds or starts without errors when you're done.
      criteria:
          shared: [config-from-env, stays-in-folder, builds]
          assertions:
              - dependency: posthog-js
              - dependency: '@posthog/react'
          rubrics:
              required-steps-done: >-
                  {folder}/src/main.tsx wraps the rendered app in PostHogProvider
                  imported from @posthog/react, passing the project token as apiKey
                  and an options object with api_host. The token and host come from
                  VITE_-prefixed variables read through import.meta.env (the expected
                  names are VITE_POSTHOG_PROJECT_TOKEN and VITE_POSTHOG_HOST, though
                  other VITE_ names pass). Cite the file and line(s).
              uses-defaults: >-
                  The PostHog options include a defaults option set to a date string
                  (the current recommended value is '2026-08-30'). Cite the file and
                  line(s).

    - id: capture-login-event
      description: >-
          Tests whether the React install page also teaches enough to capture a custom
          event from a component, here when a user signs in through the login form.
      workspace:
          fixture: react-vite
      prompt: |
          The app in {folder}/ needs product analytics. Set up PostHog in it, and
          also track an event each time a user signs in through the login form.
          Only change files inside {folder}/. Read the project token and host from
          environment variables rather than writing them into the code. Make sure the
          app still builds or starts without errors when you're done.
      criteria:
          shared: [config-from-env, stays-in-folder, builds]
          assertions:
              - dependency: posthog-js
              - dependency: '@posthog/react'
          rubrics:
              provider-wraps-app: >-
                  {folder}/src/main.tsx wraps the app in PostHogProvider from
                  @posthog/react. Cite the file and line(s).
              captures-sign-in: >-
                  The login form's submit handler in {folder}/src/routes/login.tsx
                  calls posthog.capture with a descriptive event name when the user
                  signs in. The posthog instance comes from the usePostHog hook
                  imported from @posthog/react, or from importing posthog from
                  posthog-js. Cite the file and line(s).
