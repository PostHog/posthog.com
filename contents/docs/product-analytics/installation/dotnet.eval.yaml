owner: wizard-and-docs
tags: [install, dotnet]
status: draft

checks:
    - id: install
      description: >-
          Tests whether the .NET install page alone gets an agent to a working PostHog
          .NET setup with config from env. Draft until the dotnet-app fixture exists.
      codebase_to_test: dotnet-app
      prompt: &install-prompt |
          The app in {folder}/ needs product analytics. Set up PostHog in it.
          Only change files inside {folder}/. Read the project token and host from environment variables rather than writing them into the code. Make sure the app still builds or starts without errors when you're done.
      append_docs_link: true
      criteria: &install-criteria
          shared: [config-from-env, stays-in-folder, builds]
          rubrics:
              sdk-installed: >-
                  The app's .csproj in {folder}/ references the PostHog.AspNetCore package (for an ASP.NET Core app) or the PostHog package (for a console or worker app).
              required-steps-done: >-
                  For ASP.NET Core, Program.cs calls builder.AddPostHog() and the PostHog section of configuration supplies ProjectToken and HostUrl. Otherwise, the app creates a single PostHogClient with PostHogOptions setting ProjectToken and HostUrl and reuses it, disposing it (for example with await using) so queued events are sent before exit. Cite the file and line(s).

    - id: install-no-docs
      description: Same task as install, with no docs and nothing attached. Compare the two to see what the page adds.
      codebase_to_test: dotnet-app
      prompt: *install-prompt
      criteria: *install-criteria

    - id: install-mcp
      description: Same task as install, with no docs in the prompt and the PostHog MCP attached.
      codebase_to_test: dotnet-app
      prompt: *install-prompt
      attach_mcp: posthog
      criteria: *install-criteria

    - id: install-skill # placeholder: skipped until skills are built
      description: Same task as install, with this page attached as a skill instead of in the prompt.
      codebase_to_test: dotnet-app
      prompt: *install-prompt
      attach_skill: true
      criteria: *install-criteria
